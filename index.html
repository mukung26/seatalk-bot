<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SeaAuto Cloud</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Outlined" rel="stylesheet">
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        body { font-family: 'Roboto', sans-serif; background: #f0f4f8; color: #1f1f1f; overflow: hidden; }
        h1, h2, h3, .google-font { font-family: 'Google Sans', 'Roboto', sans-serif; }
        .m3-card { background: white; border-radius: 16px; border: 1px solid #e0e2e7; transition: box-shadow 0.2s; }
        .m3-card:hover { box-shadow: 0 4px 8px rgba(0,0,0,0.05); }
        .m3-nav-item { border-radius: 9999px; }
        .modal-enter { animation: modalIn 0.2s cubic-bezier(0.2, 0, 0, 1); }
        @keyframes modalIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
        .custom-scroll::-webkit-scrollbar { width: 6px; }
        .custom-scroll::-webkit-scrollbar-track { background: transparent; }
        .custom-scroll::-webkit-scrollbar-thumb { background-color: #dadce0; border-radius: 20px; }
    </style>
<script type="importmap">
{
  "imports": {
    "@google/genai": "https://esm.sh/@google/genai@^1.38.0",
    "react": "https://esm.sh/react@^19.2.3",
    "react/": "https://esm.sh/react@^19.2.3/"
  }
}
</script>
</head>
<body>
    <div id="root"></div>
    <script type="text/babel">
        const { useState, useEffect, useRef } = React;
        const BACKTICK = String.fromCharCode(96);
        const NEWLINE = String.fromCharCode(10);

        function App() {
            // Setup State - Defaulting to your provided Worker URL
            const [workerUrl, setWorkerUrl] = useState(localStorage.getItem('seaauto_worker_url') || 'https://seatalk-be.jcruspero3263.workers.dev');
            const [isConnected, setIsConnected] = useState(false);

            // UI State
            const [tab, setTab] = useState('status');
            const [sidebarOpen, setSidebarOpen] = useState(window.innerWidth > 1024);
            const [isMobile, setIsMobile] = useState(window.innerWidth <= 1024);

            // Data State
            const [config, setConfig] = useState({ tasks: [], isRunning: false });
            const [groups, setGroups] = useState([]);
            const [status, setStatus] = useState({ lastHeartbeat: 'Checking...' });
            const [clock, setClock] = useState('--:--:--');
            const [loading, setLoading] = useState(false);
            
            // Manual Send State
            const [manual, setManual] = useState({ id: '', msg: '', type: 'text' });
            
            // Modal States
            // editing now includes 'type' to handle switching between Text/Image/File in the modal
            const [editing, setEditing] = useState(null); 
            const [modal, setModal] = useState(null); 
            
            // Refs
            const textareaRef = useRef(null);      // For Manual Tab
            const modalTextareaRef = useRef(null); // For Editing Modal

            // Check connection on load
            useEffect(() => {
                if(workerUrl) refresh(false);
            }, []);

            useEffect(() => {
                const handleResize = () => {
                    const mobile = window.innerWidth <= 1024;
                    setIsMobile(mobile);
                    if (!mobile && !sidebarOpen) setSidebarOpen(true);
                    if (mobile && sidebarOpen) setSidebarOpen(false);
                };
                window.addEventListener('resize', handleResize);
                return () => window.removeEventListener('resize', handleResize);
            }, []);

            // API HELPER
            const apiCall = async (endpoint, options = {}) => {
                if (!workerUrl) throw new Error("Worker URL not set");
                const base = workerUrl.endsWith('/') ? workerUrl.slice(0, -1) : workerUrl;
                const res = await fetch(`${base}${endpoint}`, options);
                if (!res.ok) throw new Error(`API Error: ${res.statusText}`);
                return res.json();
            };

            const saveWorkerUrl = () => {
                if(!workerUrl.startsWith('http')) return alert("Invalid URL. Must start with http:// or https://");
                localStorage.setItem('seaauto_worker_url', workerUrl);
                refresh();
            };

            const refresh = async (silent = false) => {
                if (!workerUrl) return;
                if (!silent) setLoading(true);
                try {
                    const [cfg, sts] = await Promise.all([
                        apiCall('/api/config'),
                        apiCall('/api/status')
                    ]);
                    
                    setConfig(cfg || { tasks: [], isRunning: false });
                    setStatus(prev => ({ ...prev, lastHeartbeat: sts.lastHeartbeat }));
                    
                    try {
                        const grp = await apiCall('/api/groups');
                        if(Array.isArray(grp)) setGroups(grp);
                    } catch(e) { console.warn("Group fetch failed", e); }

                    if(sts.serverTime) {
                        const now = new Date();
                        const [h, m, s] = sts.serverTime.split(':').map(Number);
                        now.setHours(h, m, s);
                    }
                    setIsConnected(true);
                } catch(e) { 
                    console.error(e);
                    if(!silent) setModal({ title: "Connection Failed", content: "Could not connect to Cloudflare Worker.\n\nCheck the URL and ensure your Worker is deployed.", type: 'error' });
                    setIsConnected(false);
                }
                if(!silent) setLoading(false);
            };

            useEffect(() => { 
                if(isConnected) {
                    const sync = setInterval(() => refresh(true), 30000);
                    return () => clearInterval(sync); 
                }
            }, [isConnected]);

            useEffect(() => {
                const tick = setInterval(() => {
                    const now = new Date();
                    setClock(now.toLocaleTimeString('en-GB', { timeZone: 'Asia/Singapore', hour12: false }));
                }, 1000);
                return () => clearInterval(tick);
            }, []);

            // --- Generic Formatting Logic (Takes a ref and state setter) ---
            const insertFormat = (ref, currentMsg, setMsg, before, after = '') => {
                const el = ref.current;
                if (!el) return;
                const start = el.selectionStart;
                const end = el.selectionEnd;
                const val = currentMsg;
                const sel = val.substring(start, end);
                const isWrapped = val.substring(start - before.length, start) === before && val.substring(end, end + after.length) === after;
                let newVal = '', newCursor = 0;
                
                if (isWrapped) {
                    newVal = val.substring(0, start - before.length) + sel + val.substring(end + after.length);
                    newCursor = start - before.length;
                } else {
                    newVal = val.substring(0, start) + before + sel + after + val.substring(end);
                    newCursor = start + before.length;
                }
                setMsg(newVal);
                setTimeout(() => { el.focus(); el.setSelectionRange(newCursor, newCursor + sel.length); }, 0);
            };

            const insertList = (ref, currentMsg, setMsg, prefix) => {
                const el = ref.current;
                if (!el) return;
                const start = el.selectionStart;
                const val = currentMsg;
                const lineStart = val.lastIndexOf(NEWLINE, start - 1) + 1;
                const newVal = val.substring(0, lineStart) + prefix + val.substring(lineStart);
                setMsg(newVal);
                setTimeout(() => { el.focus(); el.setSelectionRange(start + prefix.length, start + prefix.length); }, 0);
            };

            const insertMention = (ref, currentMsg, setMsg, type) => {
                let tag = '';
                if(type === 'all') tag = '<mention-tag target="seatalk://user?id=0"/>';
                else if(type === 'email') tag = '<mention-tag target="seatalk://user?email=example@domain.com"/>';
                insertFormat(ref, currentMsg, setMsg, tag);
            };
            
            // --- Handlers for Manual Tab ---
            const manualFormat = (b, a) => insertFormat(textareaRef, manual.msg, (m) => setManual(prev => ({...prev, msg: m})), b, a);
            const manualList = (p) => insertList(textareaRef, manual.msg, (m) => setManual(prev => ({...prev, msg: m})), p);
            const manualMention = (t) => insertMention(textareaRef, manual.msg, (m) => setManual(prev => ({...prev, msg: m})), t);
            const handleManualKeyDown = (e) => {
                if ((e.ctrlKey || e.metaKey)) {
                    if (e.key === 'b') { e.preventDefault(); manualFormat('**', '**'); }
                    if (e.key === 'i') { e.preventDefault(); manualFormat('*', '*'); }
                }
            };

            // --- Handlers for Modal ---
            const modalFormat = (b, a) => insertFormat(modalTextareaRef, editing.message, (m) => setEditing(prev => ({...prev, message: m})), b, a);
            const modalList = (p) => insertList(modalTextareaRef, editing.message, (m) => setEditing(prev => ({...prev, message: m})), p);
            const modalMention = (t) => insertMention(modalTextareaRef, editing.message, (m) => setEditing(prev => ({...prev, message: m})), t);
            const handleModalKeyDown = (e) => {
                if ((e.ctrlKey || e.metaKey)) {
                    if (e.key === 'b') { e.preventDefault(); modalFormat('**', '**'); }
                    if (e.key === 'i') { e.preventDefault(); modalFormat('*', '*'); }
                }
            };

            // --- Config Actions ---
            const saveConfig = async (newCfg) => {
                setConfig(newCfg); 
                await apiCall('/api/config', { method: 'POST', body: JSON.stringify(newCfg) });
                refresh(true);
            };

            const runTest = async () => {
                setLoading(true);
                try {
                    const d = await apiCall('/api/test-cron');
                    setModal({ title: "Cron Test Result", content: JSON.stringify(d, null, 2), type: 'success' });
                    refresh(true);
                } catch(e) {
                    setModal({ title: "Error", content: e.message, type: 'error' });
                } finally {
                    setLoading(false);
                }
            };

            const sendManual = async () => {
                if(!manual.id || !manual.msg) return setModal({ title: "Missing Info", content: "Please select a group and type a message.", type: 'error' });
                let finalMsg = manual.msg;
                if (manual.type !== 'text' && !manual.msg.trim().startsWith('{')) {
                    if(manual.type === 'image') finalMsg = JSON.stringify({ tag: "image", image: { file_id: manual.msg.trim() } });
                    else if(manual.type === 'file') finalMsg = JSON.stringify({ tag: "file", file: { file_id: manual.msg.trim() } });
                }
                try {
                    const d = await apiCall('/api/send', { method: 'POST', body: JSON.stringify({ groupId: manual.id, message: finalMsg }) });
                    if(d.success) { 
                        setModal({ title: "Sent", content: "Message sent successfully!", type: 'success' }); 
                        setManual({...manual, msg:''}); 
                    } else {
                        setModal({ title: "Failed", content: "Could not send message.", type: 'error' });
                    }
                } catch(e) {
                    setModal({ title: "Error", content: e.message, type: 'error' });
                }
            };

            const toggleTask = (id) => {
                const newTasks = config.tasks.map(t => t.id === id ? { ...t, enabled: !t.enabled } : t);
                saveConfig({ ...config, tasks: newTasks });
            };

            const deleteTask = (id) => {
                if(!confirm("Are you sure you want to delete this task?")) return;
                saveConfig({ ...config, tasks: config.tasks.filter(t => t.id !== id) });
            };

            // Parse message content when opening editor to detect if it's an image/file
            const openEditModal = (task) => {
                let type = 'text';
                let content = task.message;
                
                try {
                    const obj = JSON.parse(task.message);
                    if (obj.tag === 'image' && obj.image && obj.image.file_id) {
                        type = 'image';
                        content = obj.image.file_id;
                    } else if (obj.tag === 'file' && obj.file && obj.file.file_id) {
                        type = 'file';
                        content = obj.file.file_id;
                    }
                } catch(e) {
                    // Not JSON, stay as text
                }
                
                setEditing({ ...task, type, message: content });
            };

            const createNewTask = () => {
                setEditing({ 
                    id: Date.now(), 
                    name: 'New Automation', 
                    groupId: '', 
                    time: '09:00', 
                    message: '', 
                    type: 'text', 
                    enabled: true 
                });
            };

            const saveTask = () => {
                if (!editing.name || !editing.groupId || !editing.time) return alert("Please fill required fields");
                
                // Construct final message based on type
                let finalMsg = editing.message;
                if (editing.type !== 'text') {
                    if (editing.type === 'image') finalMsg = JSON.stringify({ tag: "image", image: { file_id: editing.message.trim() } });
                    else if (editing.type === 'file') finalMsg = JSON.stringify({ tag: "file", file: { file_id: editing.message.trim() } });
                }

                const newTask = { 
                    id: editing.id,
                    name: editing.name,
                    groupId: editing.groupId,
                    time: editing.time,
                    message: finalMsg,
                    enabled: editing.enabled,
                    lastRunDate: editing.lastRunDate
                };

                const grp = groups.find(g => g.id === newTask.groupId);
                newTask.groupName = grp ? grp.name : 'Unknown Group';
                
                let newTasks = [...(config.tasks || [])];
                const idx = newTasks.findIndex(t => t.id === newTask.id);
                if(idx > -1) newTasks[idx] = newTask; else newTasks.push(newTask);
                
                saveConfig({ ...config, tasks: newTasks });
                setEditing(null);
            };

            if (!isConnected && !loading) {
                return (
                    <div className="min-h-screen flex items-center justify-center bg-slate-50 p-4">
                        <div className="bg-white p-8 rounded-xl shadow-lg max-w-md w-full">
                            <h1 className="text-2xl font-bold mb-2 text-slate-800">Connect to Backend</h1>
                            <p className="text-slate-500 mb-6 text-sm">Enter the URL of your deployed Cloudflare Worker.</p>
                            <label className="block text-xs font-bold text-slate-500 uppercase tracking-wide mb-2">Worker URL</label>
                            <input className="w-full border border-slate-300 rounded-lg p-3 mb-4 focus:ring-2 focus:ring-blue-500 outline-none" placeholder="https://sea-auto.your-name.workers.dev" value={workerUrl} onChange={e => setWorkerUrl(e.target.value)} />
                            <button onClick={saveWorkerUrl} className="w-full bg-blue-600 text-white font-bold py-3 rounded-lg hover:bg-blue-700 transition">Connect</button>
                        </div>
                    </div>
                );
            }

            if (loading && !config.tasks) return <div className="h-screen flex items-center justify-center flex-col bg-white"><div className="w-12 h-12 border-4 border-blue-600 border-t-transparent rounded-full animate-spin mb-4"></div><span className="text-gray-500 font-medium animate-pulse">Loading SeaAuto...</span></div>;

            // Toolbar Component for Reuse
            const Toolbar = ({ isText, onFormat, onList, onMention }) => {
                if (!isText) return null;
                return (
                    <div className="flex flex-wrap items-center gap-1 mb-2 bg-slate-50 p-1.5 rounded-lg border border-slate-200">
                        <button onClick={()=>onFormat('**', '**')} className="p-1.5 hover:bg-white rounded transition" title="Bold (Ctrl+B)"><span className="material-icons-outlined text-lg">format_bold</span></button>
                        <button onClick={()=>onFormat('*', '*')} className="p-1.5 hover:bg-white rounded transition" title="Italic (Ctrl+I)"><span className="material-icons-outlined text-lg">format_italic</span></button>
                        <div className="w-px h-4 bg-gray-300 mx-1"></div>
                        <button onClick={()=>onList('- ')} className="p-1.5 hover:bg-white rounded transition" title="Bullet List"><span className="material-icons-outlined text-lg">format_list_bulleted</span></button>
                        <button onClick={()=>onList('1. ')} className="p-1.5 hover:bg-white rounded transition" title="Numbered List"><span className="material-icons-outlined text-lg">format_list_numbered</span></button>
                        <div className="w-px h-4 bg-gray-300 mx-1"></div>
                        <button onClick={()=>onFormat(BACKTICK, BACKTICK)} className="p-1.5 hover:bg-white rounded transition" title="Inline Code"><span className="material-icons-outlined text-lg">code</span></button>
                        <button onClick={()=>onFormat(BACKTICK+BACKTICK+BACKTICK+NEWLINE, NEWLINE+BACKTICK+BACKTICK+BACKTICK)} className="p-1.5 hover:bg-white rounded transition" title="Code Block"><span className="material-icons-outlined text-lg">integration_instructions</span></button>
                        <div className="w-px h-4 bg-gray-300 mx-1"></div>
                        <button onClick={()=>onMention('all')} className="px-2 py-1 text-xs font-bold bg-blue-100 text-blue-700 rounded hover:bg-blue-200 transition" title="Mention All">@All</button>
                        <button onClick={()=>onMention('email')} className="px-2 py-1 text-xs font-bold bg-gray-200 text-gray-700 rounded hover:bg-gray-300 transition" title="Mention by Email">@Email</button>
                    </div>
                );
            };

            return (
                <div className="flex h-screen bg-[#f0f4f8] overflow-hidden">
                    <header className="fixed top-0 left-0 right-0 h-16 bg-white z-50 px-4 flex items-center justify-between shadow-sm border-b border-gray-200">
                        <div className="flex items-center gap-4">
                            <button onClick={() => setSidebarOpen(!sidebarOpen)} className="p-2 rounded-full hover:bg-gray-100 text-gray-600 transition-colors"><span className="material-icons-outlined">menu</span></button>
                            <div className="flex items-center gap-2">
                                <span className="material-icons-outlined text-[#1a73e8] text-2xl">cloud_circle</span>
                                <span className="text-xl font-medium text-gray-700 google-font tracking-tight">SeaAuto</span>
                            </div>
                        </div>
                        <div className="flex items-center gap-3">
                            <button onClick={() => { localStorage.removeItem('seaauto_worker_url'); window.location.reload(); }} className="text-xs text-gray-400 hover:text-red-500 mr-2">Disconnect</button>
                            <div className={`hidden md:flex items-center gap-2 px-3 py-1.5 rounded-full border ${config.isRunning ? 'bg-green-50 border-green-200 text-green-700' : 'bg-gray-50 border-gray-200 text-gray-600'}`}>
                                <span className={`w-2 h-2 rounded-full ${config.isRunning ? 'bg-green-600' : 'bg-gray-400'}`}></span>
                                <span className="text-xs font-bold tracking-wide uppercase">{config.isRunning ? 'Running' : 'Paused'}</span>
                            </div>
                        </div>
                    </header>

                    <aside className={`fixed top-16 bottom-0 left-0 w-72 bg-white z-40 border-r border-gray-200 flex flex-col transition-transform duration-300 ease-in-out ${sidebarOpen ? 'translate-x-0' : '-translate-x-full'}`}>
                        <div className="p-4 space-y-1 flex-1 overflow-y-auto custom-scroll">
                            {[
                                { id: 'status', icon: 'dashboard', label: 'Dashboard' },
                                { id: 'tasks', icon: 'schedule', label: 'Automations' },
                                { id: 'manual', icon: 'send', label: 'Quick Send' }
                            ].map(item => (
                                <button key={item.id} onClick={() => { setTab(item.id); if(isMobile) setSidebarOpen(false); }} className={`w-full flex items-center px-4 py-3 text-sm font-medium transition-colors m3-nav-item ${tab === item.id ? 'bg-[#e8f0fe] text-[#1a73e8]' : 'text-gray-600 hover:bg-gray-50'}`}>
                                    <span className="material-icons-outlined mr-4 text-[24px]">{item.icon}</span>{item.label}
                                </button>
                            ))}
                        </div>
                        <div className="p-4 border-t border-gray-100 bg-gray-50">
                            <div className="text-xs font-medium text-gray-500 uppercase tracking-wider mb-2">Server Time (GMT+8)</div>
                            <div className="font-mono text-xl text-gray-800 font-bold">{clock}</div>
                        </div>
                    </aside>

                    {isMobile && sidebarOpen && (<div className="fixed inset-0 bg-black/30 z-30 backdrop-blur-sm transition-opacity" onClick={() => setSidebarOpen(false)}></div>)}

                    <main className={`flex-1 pt-16 h-screen overflow-y-auto transition-all duration-300 ${!isMobile && sidebarOpen ? 'ml-72' : 'ml-0'}`}>
                        <div className="max-w-6xl mx-auto p-4 md:p-8">
                            {tab === 'status' && (
                                <div className="animate-fade-in space-y-6">
                                    <div className="grid md:grid-cols-2 gap-6">
                                        <div className="m3-card p-6 relative overflow-hidden">
                                            <div className="absolute top-0 right-0 p-4 opacity-10"><span className="material-icons-outlined text-9xl text-gray-500">settings_power</span></div>
                                            <h2 className="text-xl font-medium text-gray-800 mb-2">System Engine</h2>
                                            <p className="text-gray-500 text-sm mb-6 max-w-xs">Master control for your automated tasks.</p>
                                            <button onClick={()=>saveConfig({...config, isRunning: !config.isRunning})} className={`px-6 py-3 rounded-full font-medium text-sm transition shadow-sm ${config.isRunning ? 'bg-red-50 text-red-700 hover:bg-red-100 border border-red-200' : 'bg-[#1a73e8] text-white hover:bg-blue-700'}`}>{config.isRunning ? 'Stop Engine' : 'Start Engine'}</button>
                                        </div>
                                        <div className="m3-card p-6">
                                            <h2 className="text-xl font-medium text-gray-800 mb-6">Diagnostics</h2>
                                            <div className="space-y-4">
                                                <div className="flex justify-between items-center py-2 border-b border-gray-50"><span className="text-sm text-gray-600 flex items-center gap-2"><span className="material-icons-outlined text-sm text-gray-400">dns</span> Cloudflare KV</span><span className="text-xs bg-green-100 text-green-800 px-2 py-1 rounded-md font-bold">OK</span></div>
                                                <div className="flex justify-between items-center py-2 border-b border-gray-50"><span className="text-sm text-gray-600 flex items-center gap-2"><span className="material-icons-outlined text-sm text-gray-400">update</span> Last Heartbeat</span><span className="text-xs font-mono text-gray-600">{status.lastHeartbeat}</span></div>
                                                <button onClick={runTest} className="w-full mt-2 py-2 text-blue-600 text-sm font-medium hover:bg-blue-50 rounded-lg transition text-left px-2">Run Cron Trigger Test →</button>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            )}

                            {tab === 'tasks' && (
                                <div className="space-y-6 animate-fade-in">
                                    <div className="flex justify-between items-center"><h2 className="text-2xl font-medium text-gray-800">Your Automations</h2><button onClick={createNewTask} className="flex items-center gap-2 bg-[#1a73e8] text-white px-5 py-2.5 rounded-full shadow-md hover:shadow-lg transition transform active:scale-95 font-medium text-sm"><span className="material-icons-outlined text-lg">add</span>Create</button></div>
                                    {config.tasks && config.tasks.length > 0 ? (
                                        <div className="grid gap-4">{config.tasks.map(t => (
                                            <div key={t.id} className="m3-card p-4 flex flex-col md:flex-row items-center gap-4 hover:border-blue-200 transition-colors">
                                                <div className="w-16 h-16 bg-blue-50 rounded-2xl flex flex-col items-center justify-center text-[#1a73e8] flex-shrink-0"><span className="text-lg font-bold">{t.time}</span><span className="text-[10px] uppercase font-bold tracking-wider text-blue-400">Daily</span></div>
                                                <div className="flex-1 text-center md:text-left"><h3 className="font-medium text-gray-900">{t.name}</h3><p className="text-sm text-gray-500 flex items-center justify-center md:justify-start gap-1"><span className="material-icons-outlined text-sm">group</span>{t.groupName || t.groupId}</p></div>
                                                <div className="flex items-center gap-2"><button onClick={()=>toggleTask(t.id)} className={`p-2 rounded-full border ${t.enabled ? 'text-green-600 bg-green-50 border-green-200' : 'text-gray-400 bg-gray-50 border-gray-200'}`}><span className="material-icons-outlined">{t.enabled ? 'toggle_on' : 'toggle_off'}</span></button><button onClick={()=>openEditModal(t)} className="p-2 rounded-full text-gray-500 hover:bg-gray-100"><span className="material-icons-outlined">edit</span></button><button onClick={()=>deleteTask(t.id)} className="p-2 rounded-full text-red-400 hover:bg-red-50"><span className="material-icons-outlined">delete</span></button></div>
                                            </div>
                                        ))}</div>
                                    ) : (<div className="text-center py-20 bg-white rounded-2xl border border-dashed border-gray-300"><span className="material-icons-outlined text-6xl text-gray-300">schedule</span><h3 className="text-gray-500 font-medium">No schedules yet</h3></div>)}
                                </div>
                            )}

                            {tab === 'manual' && (
                                <div className="max-w-2xl mx-auto m3-card p-6 md:p-8 animate-fade-in flex flex-col">
                                    <h2 className="text-xl font-medium text-gray-800 mb-6 flex items-center gap-2"><span className="material-icons-outlined text-gray-400">send</span>Instant Message</h2>
                                    <div className="space-y-6">
                                        <div>
                                            <label className="block text-xs font-bold text-gray-500 uppercase tracking-wide mb-2">Recipient Group</label>
                                            <div className="relative"><select className="w-full bg-gray-50 border border-gray-200 rounded-lg py-3 px-4 appearance-none focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-[#1a73e8] transition" value={manual.id} onChange={e=>setManual({...manual, id:e.target.value})}><option value="">Select a group...</option>{groups.map(g => <option key={g.id} value={g.id}>{g.name}</option>)}</select><span className="material-icons-outlined absolute right-3 top-3 text-gray-400 pointer-events-none">expand_more</span></div>
                                        </div>
                                        <div>
                                            <label className="block text-xs font-bold text-gray-500 uppercase tracking-wide mb-2">Message Format</label>
                                            <div className="flex gap-2 overflow-x-auto pb-2">
                                                {[{id: 'text', label: 'Text', icon: 'chat'}, {id: 'image', label: 'Image', icon: 'image'}, {id: 'file', label: 'File', icon: 'description'}].map(t => (
                                                    <button key={t.id} onClick={() => setManual({...manual, type: t.id})} className={`flex items-center gap-1 px-3 py-1.5 rounded-full text-xs font-bold border transition whitespace-nowrap ${manual.type === t.id ? 'bg-blue-600 text-white border-blue-600' : 'bg-white text-gray-600 border-gray-200 hover:bg-gray-50'}`}><span className="material-icons-outlined text-sm">{t.icon}</span>{t.label}</button>
                                                ))}
                                            </div>
                                        </div>
                                        <div>
                                            <div className="flex justify-between items-center mb-2">
                                                <label className="block text-xs font-bold text-gray-500 uppercase tracking-wide">Content</label>
                                                {manual.type === 'text' && <button onClick={() => setModal({type:'help', title:'Formatting Guide', content: ''})} className="text-[10px] text-blue-600 hover:underline flex items-center gap-1"><span className="material-icons-outlined text-[10px]">help_outline</span>Markdown Guide</button>}
                                            </div>
                                            
                                            <Toolbar isText={manual.type === 'text'} onFormat={manualFormat} onList={manualList} onMention={manualMention} />

                                            <textarea ref={textareaRef} className={`w-full bg-gray-50 border border-gray-200 rounded-lg py-3 px-4 focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-[#1a73e8] transition min-h-[200px] ${manual.type !== 'text' ? 'font-mono text-xs' : 'font-roboto'}`} value={manual.msg} onChange={e=>setManual({...manual, msg:e.target.value})} onKeyDown={handleManualKeyDown} placeholder={manual.type === 'text' ? "Type message here (Markdown supported)..." : "Enter File ID..."}></textarea>
                                        </div>
                                        <div className="flex justify-end pt-4"><button onClick={sendManual} className="bg-[#1a73e8] text-white px-6 py-3 rounded-full font-medium shadow-md hover:bg-blue-700 hover:shadow-lg transition flex items-center gap-2"><span className="material-icons-outlined text-sm">send</span>Send</button></div>
                                    </div>
                                </div>
                            )}
                        </div>
                    </main>

                    {editing && (
                        <div className="fixed inset-0 z-[60] flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm transition-opacity modal-enter">
                            <div className="bg-white rounded-2xl shadow-2xl w-full max-w-lg flex flex-col max-h-[85vh]">
                                <div className="px-6 py-4 border-b border-gray-100 flex justify-between items-center flex-shrink-0"><h3 className="text-lg font-bold text-gray-800">{editing.name || 'New Task'}</h3><button onClick={()=>setEditing(null)} className="text-gray-400 hover:text-gray-600 transition"><span className="material-icons-outlined">close</span></button></div>
                                <div className="p-6 space-y-6 overflow-y-auto custom-scroll">
                                    <div className="bg-blue-50 p-4 rounded-xl flex items-center justify-between border border-blue-100">
                                        <div><label className="text-xs font-bold text-blue-800 uppercase tracking-widest block mb-1">Trigger Time</label><input type="time" className="bg-transparent text-3xl font-bold text-gray-800 outline-none w-full p-0" value={editing.time} onChange={e=>setEditing({...editing, time:e.target.value})} /></div>
                                        <div className="text-blue-500"><span className="material-icons-outlined text-3xl">schedule</span></div>
                                    </div>
                                    <div><label className="block text-xs font-bold text-gray-500 uppercase tracking-wide mb-2">Task Name</label><input className="w-full bg-gray-50 border border-gray-200 rounded-lg py-3 px-4 focus:border-[#1a73e8] focus:ring-1 focus:ring-[#1a73e8] outline-none transition" value={editing.name} onChange={e=>setEditing({...editing, name:e.target.value})} /></div>
                                    <div><label className="block text-xs font-bold text-gray-500 uppercase tracking-wide mb-2">Target Group</label><div className="relative"><select className="w-full bg-gray-50 border border-gray-200 rounded-lg py-3 px-4 appearance-none focus:border-[#1a73e8] focus:ring-1 focus:ring-[#1a73e8] outline-none transition" value={editing.groupId} onChange={e=>setEditing({...editing, groupId:e.target.value})}><option value="">Select Group...</option>{groups.map(g => <option key={g.id} value={g.id}>{g.name}</option>)}</select><span className="material-icons-outlined absolute right-3 top-3 text-gray-400 pointer-events-none">expand_more</span></div></div>
                                    
                                    <div>
                                        <label className="block text-xs font-bold text-gray-500 uppercase tracking-wide mb-2">Message Format</label>
                                        <div className="flex gap-2 overflow-x-auto pb-2">
                                            {[{id: 'text', label: 'Text', icon: 'chat'}, {id: 'image', label: 'Image', icon: 'image'}, {id: 'file', label: 'File', icon: 'description'}].map(t => (
                                                <button key={t.id} onClick={() => setEditing({...editing, type: t.id})} className={`flex items-center gap-1 px-3 py-1.5 rounded-full text-xs font-bold border transition whitespace-nowrap ${editing.type === t.id ? 'bg-blue-600 text-white border-blue-600' : 'bg-white text-gray-600 border-gray-200 hover:bg-gray-50'}`}><span className="material-icons-outlined text-sm">{t.icon}</span>{t.label}</button>
                                            ))}
                                        </div>
                                    </div>

                                    <div>
                                        <div className="flex justify-between items-center mb-2">
                                            <label className="block text-xs font-bold text-gray-500 uppercase tracking-wide">Content</label>
                                            {editing.type === 'text' && <button onClick={() => setModal({type:'help', title:'Formatting Guide', content: ''})} className="text-[10px] text-blue-600 hover:underline flex items-center gap-1"><span className="material-icons-outlined text-[10px]">help_outline</span>Markdown Guide</button>}
                                        </div>
                                        
                                        <Toolbar isText={editing.type === 'text'} onFormat={modalFormat} onList={modalList} onMention={modalMention} />

                                        <textarea ref={modalTextareaRef} className={`w-full bg-gray-50 border border-gray-200 rounded-lg p-4 focus:border-[#1a73e8] focus:ring-1 focus:ring-[#1a73e8] outline-none transition h-32 ${editing.type !== 'text' ? 'font-mono text-xs' : 'font-roboto'}`} value={editing.message} onChange={e=>setEditing({...editing, message:e.target.value})} onKeyDown={handleModalKeyDown} placeholder={editing.type === 'text' ? "Type message..." : "Enter File ID..."}></textarea>
                                    </div>
                                </div>
                                <div className="px-6 py-4 border-t border-gray-100 flex justify-end gap-3 flex-shrink-0 bg-gray-50 rounded-b-2xl"><button onClick={()=>setEditing(null)} className="px-5 py-2 text-gray-600 font-medium hover:bg-gray-200 rounded-full transition text-sm">Cancel</button><button onClick={saveTask} className="px-6 py-2 bg-[#1a73e8] text-white font-medium rounded-full shadow-sm hover:shadow-md hover:bg-blue-700 transition text-sm">Save</button></div>
                            </div>
                        </div>
                    )}
                    
                    {modal && (
                        <div className="fixed inset-0 z-[70] flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm modal-enter" onClick={()=>setModal(null)}>
                            <div className="bg-white rounded-2xl shadow-xl w-full max-w-lg overflow-hidden" onClick={e => e.stopPropagation()}>
                                <div className={`px-6 py-4 flex items-center gap-3 ${modal.type === 'error' ? 'bg-red-50 text-red-700' : 'bg-white text-gray-800'} border-b border-gray-100`}>
                                    <span className="material-icons-outlined">{modal.type === 'error' ? 'error_outline' : (modal.type === 'help' ? 'help_outline' : 'check_circle_outline')}</span>
                                    <h3 className="font-bold">{modal.title}</h3>
                                </div>
                                <div className="p-6 max-h-[60vh] overflow-y-auto custom-scroll">
                                    {modal.type === 'help' ? (
                                        <div className="text-sm space-y-4 text-gray-600">
                                            <div className="grid grid-cols-2 gap-2 border-b border-gray-100 pb-2">
                                                <div className="font-bold">Bold</div><div className="font-mono bg-gray-50 p-1">**text**</div>
                                                <div className="font-bold">Italic</div><div className="font-mono bg-gray-50 p-1">*text*</div>
                                                <div className="font-bold">Inline Code</div><div className="font-mono bg-gray-50 p-1">{BACKTICK}text{BACKTICK}</div>
                                            </div>
                                            <div>
                                                <div className="font-bold mb-1">Lists</div>
                                                <div className="font-mono bg-gray-50 p-2 rounded whitespace-pre text-xs">- Item 1{NEWLINE}- Item 2</div>
                                            </div>
                                            <div>
                                                <div className="font-bold mb-1">Code Block</div>
                                                <div className="font-mono bg-gray-50 p-2 rounded whitespace-pre text-xs">{BACKTICK}{BACKTICK}{BACKTICK}{NEWLINE}Code{NEWLINE}{BACKTICK}{BACKTICK}{BACKTICK}</div>
                                            </div>
                                            <div>
                                                <div className="font-bold mb-1">Mentions</div>
                                                <div className="text-xs text-gray-500 mb-1">Use the toolbar buttons or specific XML tags:</div>
                                                <div className="font-mono bg-gray-50 p-2 rounded text-xs break-all">&lt;mention-tag target="seatalk://user?id=0"/&gt;</div>
                                                <div className="text-[10px] text-gray-400 mt-1">@All will verify "Notify all members" setting.</div>
                                            </div>
                                        </div>
                                    ) : (
                                        <p className="text-sm text-gray-600 whitespace-pre-wrap">{modal.content}</p>
                                    )}
                                </div>
                                <div className="px-6 py-3 bg-gray-50 border-t border-gray-100 flex justify-end">
                                    <button onClick={()=>setModal(null)} className="px-4 py-2 bg-white border border-gray-300 text-gray-700 rounded-lg text-sm font-medium hover:bg-gray-50 transition shadow-sm">Close</button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
