<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SeaAuto Cloud</title>
    
    <link rel="preconnect" href="https://cdn.tailwindcss.com">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Outlined" rel="stylesheet">
    
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        :root { --safe-bottom: env(safe-area-inset-bottom); }
        body { font-family: 'Roboto', sans-serif; background: #f0f4f8; color: #1f1f1f; overflow: hidden; touch-action: manipulation; }
        h1, h2, h3, .google-font { font-family: 'Google Sans', 'Roboto', sans-serif; }
        .m3-card { background: white; border-radius: 16px; border: 1px solid #e0e2e7; }
        .m3-card:active { transform: scale(0.995); transition: 0.1s; }
        .modal-enter { animation: modalIn 0.2s cubic-bezier(0.2, 0, 0, 1); }
        @keyframes modalIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
        .custom-scroll::-webkit-scrollbar { width: 4px; }
        .custom-scroll::-webkit-scrollbar-track { background: transparent; }
        .custom-scroll::-webkit-scrollbar-thumb { background-color: #cbd5e1; border-radius: 20px; }
        
        /* Chat */
        .chat-bubble { max-width: 85%; border-radius: 18px; padding: 10px 14px; position: relative; font-size: 0.95rem; line-height: 1.4; word-wrap: break-word; }
        .chat-bubble.in { background-color: #ffffff; color: #1e293b; border-bottom-left-radius: 4px; border: 1px solid #e2e8f0; }
        .chat-bubble.out { background-color: #2563eb; color: white; border-bottom-right-radius: 4px; }
    </style>
<script type="importmap">
{
  "imports": {
    "@google/genai": "https://esm.sh/@google/genai@^1.38.0",
    "react": "https://esm.sh/react@^19.2.3",
    "react/": "https://esm.sh/react@^19.2.3/"
  }
}
</script>
</head>
<body>
    <div id="root"></div>
    <script type="text/babel">
        const { useState, useEffect, useRef } = React;
        const BACKTICK = String.fromCharCode(96);
        const NEWLINE = String.fromCharCode(10);
        
        // HARDCODED WORKER URL (You can change this)
        const DEFAULT_WORKER_URL = 'https://seatalk-be.jcruspero3263.workers.dev';

        function App() {
            const [workerUrl, setWorkerUrl] = useState(localStorage.getItem('seaauto_worker_url') || DEFAULT_WORKER_URL);
            const [isConnected, setIsConnected] = useState(false);
            const [tab, setTab] = useState('status');
            
            // Data State
            const [config, setConfig] = useState({ tasks: [], isRunning: false });
            const [status, setStatus] = useState({ lastHeartbeat: '...', kvStatus: '...' });
            const [clock, setClock] = useState('--:--:--');
            const [loading, setLoading] = useState(false);
            
            // Chat
            const [chatHistory, setChatHistory] = useState([]);
            const [chatRecipient, setChatRecipient] = useState('');
            const [chatMsg, setChatMsg] = useState('');
            const chatEndRef = useRef(null);
            const chatInputRef = useRef(null);
            
            // Manual Send
            const [manual, setManual] = useState({ id: '', msg: '' });
            
            // Modals
            const [editing, setEditing] = useState(null); 
            const [modal, setModal] = useState(null); 
            
            // Refs
            const manualTextareaRef = useRef(null);
            const modalTextareaRef = useRef(null);

            // API Helper
            const apiCall = async (endpoint, options = {}) => {
                const base = workerUrl.endsWith('/') ? workerUrl.slice(0, -1) : workerUrl;
                const res = await fetch(`${base}${endpoint}`, options);
                if (!res.ok) throw new Error(`API Error: ${res.statusText}`);
                return res.json();
            };

            // Formatting
            const insertFormat = (ref, setter, val, before, after='') => {
                if (!ref.current) return;
                const el = ref.current;
                const start = el.selectionStart;
                const end = el.selectionEnd;
                const sel = val.substring(start, end);
                const isWrapped = val.substring(start-before.length, start) === before && val.substring(end, end+after.length) === after;
                let newVal = isWrapped ? val.substring(0, start-before.length) + sel + val.substring(end+after.length) 
                                       : val.substring(0, start) + before + sel + after + val.substring(end);
                setter(newVal);
                setTimeout(() => {
                    el.focus();
                    const newCursor = isWrapped ? start - before.length : start + before.length;
                    el.setSelectionRange(newCursor, newCursor + sel.length);
                }, 0);
            };
            
            const insertMention = (ref, setter, val, type) => {
                let tag = '';
                if(type === 'all') tag = '<mention-tag target="seatalk://user?id=0"/>';
                else if(type === 'email') tag = '<mention-tag target="seatalk://user?email=test@example.com"/>';
                insertFormat(ref, setter, val, tag);
            };

            const refresh = async (silent = false) => {
                if (!silent) setLoading(true);
                try {
                    const [cfg, sts, chats] = await Promise.all([
                        apiCall('/api/config'),
                        apiCall('/api/status'),
                        apiCall('/api/chat-history').catch(() => [])
                    ]);
                    setConfig(cfg || { tasks: [], isRunning: false });
                    setStatus(prev => ({ ...prev, lastHeartbeat: sts.lastHeartbeat, kvStatus: sts.kvStatus }));
                    if (Array.isArray(chats)) setChatHistory(chats);
                    setIsConnected(true);
                } catch(e) { 
                    if(!silent) console.error("Connection Error", e);
                    setIsConnected(false);
                }
                if(!silent) setLoading(false);
            };

            useEffect(() => { refresh(); }, []);
            useEffect(() => { const i = setInterval(() => refresh(true), 5000); return () => clearInterval(i); }, []);
            
            useEffect(() => {
                const tick = setInterval(() => setClock(new Date().toLocaleTimeString('en-GB', { timeZone: 'Asia/Singapore', hour12: false })), 1000);
                return () => clearInterval(tick);
            }, []);

            // Auto-scroll chat
            useEffect(() => { if (tab === 'chat' && chatEndRef.current) chatEndRef.current.scrollIntoView({ behavior: 'smooth' }); }, [chatHistory, tab, chatRecipient]);

            const saveConfig = async (newCfg) => {
                setConfig(newCfg);
                await apiCall('/api/config', { method: 'POST', body: JSON.stringify(newCfg) });
                refresh(true);
            };

            const sendChatReply = async () => {
                if (!chatRecipient || !chatMsg.trim()) return;
                try {
                    const d = await apiCall('/api/send', { method: 'POST', body: JSON.stringify({ groupId: chatRecipient, message: chatMsg }) });
                    if (d.success) { setChatMsg(''); refresh(true); }
                } catch(e) {}
            };

            const sendManual = async () => {
                if(!manual.id || !manual.msg) return setModal({title:"Error", content:"Missing Group ID or Message", type:'error'});
                try {
                    await apiCall('/api/send', { method: 'POST', body: JSON.stringify({ groupId: manual.id, message: manual.msg }) });
                    setModal({title:"Sent", content:"Message sent to group", type:'success'});
                    setManual({...manual, msg:''});
                } catch(e) { setModal({title:"Error", content:e.message, type:'error'}); }
            };

            const Toolbar = ({ setter, val, textRef }) => (
                <div className="flex gap-1 mb-2 bg-slate-50 p-1 rounded-lg overflow-x-auto no-scrollbar">
                    <button onClick={()=>insertFormat(textRef, (v)=>setter(v), val, '**','**')} className="p-2 hover:bg-white rounded min-w-[32px]" title="Bold"><span className="material-icons-outlined text-sm">format_bold</span></button>
                    <button onClick={()=>insertFormat(textRef, (v)=>setter(v), val, '*','*')} className="p-2 hover:bg-white rounded min-w-[32px]" title="Italic"><span className="material-icons-outlined text-sm">format_italic</span></button>
                    <button onClick={()=>insertFormat(textRef, (v)=>setter(v), val, '`','`')} className="p-2 hover:bg-white rounded min-w-[32px]" title="Code"><span className="material-icons-outlined text-sm">code</span></button>
                    <div className="w-px h-4 bg-gray-300 mx-1 flex-shrink-0 self-center"></div>
                    <button onClick={()=>insertMention(textRef, (v)=>setter(v), val, 'all')} className="px-2 py-1 bg-blue-100 text-blue-800 text-xs rounded font-bold whitespace-nowrap">@All</button>
                    <button onClick={()=>insertMention(textRef, (v)=>setter(v), val, 'email')} className="px-2 py-1 bg-gray-200 text-gray-800 text-xs rounded font-bold whitespace-nowrap">@Email</button>
                </div>
            );

            // AUTOMATION ACTIONS
            const deleteTask = (id) => {
                if(!confirm("Delete this automation?")) return;
                const newTasks = config.tasks.filter(t => t.id !== id);
                saveConfig({ ...config, tasks: newTasks });
                setEditing(null);
            };

            const saveTask = () => {
                if (!editing.name || !editing.groupId || !editing.time) return alert("Fill required fields");
                
                let finalMsg = editing.message;
                
                // Construct Interactive/Media Messages
                if (editing.type === 'interactive') {
                    finalMsg = JSON.stringify({
                        tag: "interactive_message",
                        interactive_message: {
                            elements: [
                                { element_type: "title", title: { text: editing.interactiveTitle || "Notification" } },
                                { element_type: "description", description: { format: 1, text: editing.message || "" } }
                            ]
                        }
                    });
                } else if (editing.type === 'image') {
                    finalMsg = JSON.stringify({ tag: "image", image: { file_id: editing.message.trim() } });
                } else if (editing.type === 'file') {
                    finalMsg = JSON.stringify({ tag: "file", file: { file_id: editing.message.trim() } });
                }

                const newTask = { ...editing, message: finalMsg };
                
                let newTasks = [...(config.tasks || [])];
                const idx = newTasks.findIndex(t => t.id === newTask.id);
                if(idx > -1) newTasks[idx] = newTask; else newTasks.push(newTask);
                
                saveConfig({ ...config, tasks: newTasks });
                setEditing(null);
            };

            // Parse existing task message to determine type for UI
            const openEditModal = (task) => {
                let type = 'text';
                let content = task.message;
                let title = '';

                try {
                    const obj = JSON.parse(task.message);
                    if (obj.tag === 'interactive_message') {
                        type = 'interactive';
                        const els = obj.interactive_message?.elements || [];
                        const tEl = els.find(e => e.element_type === 'title');
                        const dEl = els.find(e => e.element_type === 'description');
                        if (tEl) title = tEl.title.text;
                        if (dEl) content = dEl.description.text;
                    } else if (obj.tag === 'image') {
                        type = 'image';
                        content = obj.image.file_id;
                    } else if (obj.tag === 'file') {
                        type = 'file';
                        content = obj.file.file_id;
                    }
                } catch(e) {}

                setEditing({ ...task, type, message: content, interactiveTitle: title });
            };

            if (!isConnected && loading) return <div className="h-screen flex items-center justify-center"><div className="w-8 h-8 border-4 border-blue-600 rounded-full border-t-transparent animate-spin"></div></div>;

            return (
                <div className="flex h-[100dvh] bg-[#f0f4f8] overflow-hidden flex-col md:flex-row">
                    
                    {/* SIDEBAR */}
                    <aside className="hidden md:flex flex-col fixed top-0 bottom-0 left-0 w-64 bg-white border-r border-gray-200 z-30">
                        <div className="h-16 flex items-center px-6">
                             <span className="material-icons-outlined text-blue-600 text-3xl mr-2">cloud_circle</span>
                             <span className="text-xl font-bold text-gray-800 tracking-tight">SeaAuto</span>
                        </div>
                        <div className="p-4 space-y-1 flex-1 overflow-y-auto">
                            {[
                                { id: 'status', icon: 'dashboard', label: 'Dashboard' },
                                { id: 'tasks', icon: 'schedule', label: 'Automations' },
                                { id: 'chat', icon: 'forum', label: 'Live Chat' },
                                { id: 'manual', icon: 'send', label: 'Quick Send' }
                            ].map(item => (
                                <button key={item.id} onClick={() => setTab(item.id)} className={`w-full flex items-center px-4 py-3 text-sm font-medium rounded-xl transition-colors ${tab === item.id ? 'bg-blue-50 text-blue-700' : 'text-gray-600 hover:bg-gray-50'}`}>
                                    <span className="material-icons-outlined mr-3">{item.icon}</span>{item.label}
                                </button>
                            ))}
                        </div>
                        <div className="p-4 bg-gray-50 border-t border-gray-100">
                            <div className="text-xs text-gray-500 uppercase font-bold">Server Time</div>
                            <div className="font-mono text-xl font-bold text-gray-800">{clock}</div>
                        </div>
                    </aside>

                    {/* MOBILE NAV */}
                    <div className="md:hidden fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 flex justify-around h-16 z-50 pb-[env(safe-area-inset-bottom)]">
                         {[
                            { id: 'status', icon: 'dashboard', label: 'Home' },
                            { id: 'tasks', icon: 'schedule', label: 'Auto' },
                            { id: 'chat', icon: 'forum', label: 'Chat' },
                            { id: 'manual', icon: 'send', label: 'Send' }
                        ].map(item => (
                            <button key={item.id} onClick={() => setTab(item.id)} className={`flex flex-col items-center justify-center w-full ${tab === item.id ? 'text-blue-600' : 'text-gray-400'}`}>
                                <span className="material-icons-outlined text-2xl">{item.icon}</span>
                                <span className="text-[10px] font-medium">{item.label}</span>
                            </button>
                        ))}
                    </div>

                    {/* MAIN CONTENT */}
                    <main className="flex-1 md:ml-64 h-full overflow-y-auto custom-scroll pb-20 md:pb-0 bg-[#f0f4f8]">
                        <div className="max-w-4xl mx-auto p-4 md:p-8">
                            
                            {/* DASHBOARD */}
                            {tab === 'status' && (
                                <div className="space-y-4 animate-fade-in">
                                    <h2 className="text-2xl font-bold text-gray-800 md:hidden mb-4">SeaAuto</h2>
                                    <div className="m3-card p-6 bg-white flex flex-col items-center text-center">
                                        <div className={`w-16 h-16 rounded-full flex items-center justify-center mb-4 ${config.isRunning ? 'bg-green-100 text-green-600' : 'bg-gray-100 text-gray-400'}`}>
                                            <span className="material-icons-outlined text-3xl">power_settings_new</span>
                                        </div>
                                        <h2 className="text-xl font-bold text-gray-900">{config.isRunning ? 'System Active' : 'System Paused'}</h2>
                                        <p className="text-gray-500 text-sm mb-6 max-w-xs">Automated tasks are {config.isRunning ? 'running on schedule' : 'currently disabled'}.</p>
                                        <button onClick={()=>saveConfig({...config, isRunning: !config.isRunning})} className={`px-8 py-3 rounded-full font-bold shadow-md transition-all ${config.isRunning ? 'bg-white border border-red-200 text-red-600 hover:bg-red-50' : 'bg-blue-600 text-white hover:bg-blue-700'}`}>
                                            {config.isRunning ? 'Stop Engine' : 'Start Engine'}
                                        </button>
                                    </div>
                                </div>
                            )}

                            {/* TASKS */}
                            {tab === 'tasks' && (
                                <div className="space-y-4 animate-fade-in">
                                    <div className="flex justify-between items-center mb-2">
                                        <h2 className="text-xl font-bold text-gray-800">Automations</h2>
                                        <button onClick={()=>setEditing({id: Date.now(), name:'New Task', time:'09:00', groupId:'', message:'', type:'text', enabled:true})} className="bg-blue-600 text-white w-10 h-10 rounded-full shadow flex items-center justify-center"><span className="material-icons-outlined">add</span></button>
                                    </div>
                                    {config.tasks?.map(t => (
                                        <div key={t.id} onClick={()=>openEditModal(t)} className="m3-card p-4 flex items-center gap-3 cursor-pointer hover:border-blue-300 transition">
                                            <div className="w-12 h-12 bg-blue-50 rounded-xl flex flex-col items-center justify-center text-blue-700 font-bold leading-none">
                                                <span>{t.time.split(':')[0]}</span><span className="text-xs">{t.time.split(':')[1]}</span>
                                            </div>
                                            <div className="flex-1 min-w-0">
                                                <h3 className="font-bold text-gray-900 truncate">{t.name}</h3>
                                                <p className="text-xs text-gray-500 truncate">{t.groupId}</p>
                                            </div>
                                            <div className={`w-3 h-3 rounded-full ${t.enabled ? 'bg-green-500' : 'bg-gray-300'}`}></div>
                                        </div>
                                    ))}
                                </div>
                            )}

                            {/* CHAT */}
                            {tab === 'chat' && (
                                <div className="flex flex-col h-[calc(100vh-80px)] md:h-[calc(100vh-60px)] -m-4 md:m-0 bg-white md:rounded-2xl md:shadow-sm border border-gray-200">
                                    <div className="p-3 border-b border-gray-100 flex justify-between items-center bg-gray-50/50">
                                        <h3 className="font-bold text-gray-700 flex items-center gap-2"><span className="material-icons-outlined">forum</span> Live Chat</h3>
                                        <button onClick={()=>{
                                            const email = prompt("Enter Employee Email:");
                                            if(email && email.includes('@')) setChatRecipient(email);
                                        }} className="text-xs bg-blue-100 text-blue-700 px-3 py-1.5 rounded-full font-bold hover:bg-blue-200 transition">
                                            + New Chat
                                        </button>
                                    </div>
                                    <div className="flex-1 overflow-y-auto p-4 space-y-3 custom-scroll bg-slate-50">
                                        {chatHistory.length === 0 && <div className="text-center text-gray-400 mt-20">No messages</div>}
                                        {chatHistory.sort((a,b)=>a.time-b.time).map((msg, i) => (
                                            <div key={i} className={`flex flex-col w-full ${msg.direction === 'out' ? 'items-end' : 'items-start'}`}>
                                                <div className="text-[10px] text-gray-400 mb-1 px-2 flex gap-2">
                                                    <span className="font-bold">{msg.senderName || 'Unknown'}</span>
                                                    <span>{msg.senderEmail || (msg.sender && msg.sender.startsWith('e_') ? msg.sender : '')}</span>
                                                </div>
                                                <div onClick={() => {
                                                    let target = msg.sender;
                                                    if(msg.senderEmail) target = msg.senderEmail; 
                                                    setChatRecipient(target);
                                                }} className={`chat-bubble cursor-pointer ${msg.direction === 'out' ? 'out' : 'in'} shadow-sm`}>
                                                    {msg.text}
                                                </div>
                                                <div className="text-[9px] text-gray-300 mt-1 px-1">{new Date(msg.time).toLocaleTimeString()}</div>
                                            </div>
                                        ))}
                                        <div ref={chatEndRef}></div>
                                    </div>
                                    
                                    {/* Chat Input Area */}
                                    <div className="p-3 bg-white border-t border-gray-200">
                                        {chatRecipient && (
                                            <div className="flex justify-between bg-blue-50 px-3 py-1.5 rounded text-xs text-blue-800 mb-2">
                                                <span>Replying to: <b>{chatRecipient}</b></span>
                                                <button onClick={()=>setChatRecipient('')}><span className="material-icons-outlined text-sm">close</span></button>
                                            </div>
                                        )}
                                        <div className="border border-gray-200 rounded-xl p-2 bg-gray-50 focus-within:bg-white focus-within:ring-1 focus-within:ring-blue-500 transition-colors">
                                            <Toolbar setter={setChatMsg} val={chatMsg} textRef={chatInputRef} />
                                            <div className="flex gap-2 items-end">
                                                <textarea ref={chatInputRef} className="flex-1 bg-transparent text-sm outline-none resize-none max-h-24 py-2" rows="1" placeholder={chatRecipient ? "Type reply..." : "Select a user to reply..."} value={chatMsg} onChange={e=>setChatMsg(e.target.value)} onKeyDown={e=> { if(e.key==='Enter' && !e.shiftKey) { e.preventDefault(); sendChatReply(); } }} disabled={!chatRecipient}></textarea>
                                                <button onClick={sendChatReply} disabled={!chatRecipient || !chatMsg.trim()} className="bg-blue-600 text-white w-8 h-8 rounded-full flex items-center justify-center mb-1 disabled:opacity-50 hover:bg-blue-700 transition"><span className="material-icons-outlined text-sm">send</span></button>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            )}

                            {/* MANUAL - GROUP ONLY */}
                            {tab === 'manual' && (
                                <div className="m3-card p-6 space-y-4 animate-fade-in">
                                    <h2 className="text-xl font-bold">Quick Send (Group Only)</h2>
                                    <div>
                                        <label className="text-xs font-bold text-gray-500 uppercase">Group ID</label>
                                        <input className="w-full mt-1 bg-gray-50 border rounded-lg p-3 font-mono" placeholder="e.g. 123456789" value={manual.id} onChange={e=>setManual({...manual, id:e.target.value.replace(/\D/g,'')})} />
                                        <p className="text-[10px] text-gray-400 mt-1">Only numeric Group IDs are supported here.</p>
                                    </div>
                                    <div>
                                        <label className="text-xs font-bold text-gray-500 uppercase">Message</label>
                                        <div className="mt-1 border border-gray-200 rounded-xl p-2 bg-gray-50 focus-within:bg-white focus-within:ring-1 focus-within:ring-blue-500 transition-colors">
                                            <Toolbar setter={(v)=>setManual({...manual, msg:v})} val={manual.msg} textRef={manualTextareaRef} />
                                            <textarea ref={manualTextareaRef} className="w-full bg-transparent p-2 h-32 text-sm outline-none resize-none" placeholder="Type message..." value={manual.msg} onChange={e=>setManual({...manual, msg:e.target.value})}></textarea>
                                        </div>
                                    </div>
                                    <button onClick={sendManual} className="w-full bg-blue-600 text-white font-bold py-3 rounded-lg shadow hover:bg-blue-700 transition">Send to Group</button>
                                </div>
                            )}
                        </div>
                    </main>

                    {/* EDIT MODAL */}
                    {editing && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/50 p-4 backdrop-blur-sm">
                            <div className="bg-white w-full max-w-md rounded-2xl p-6 shadow-2xl flex flex-col max-h-[90vh]">
                                <h3 className="font-bold text-lg mb-4">Edit Automation</h3>
                                <div className="space-y-4 overflow-y-auto custom-scroll flex-1">
                                    <div className="flex gap-2">
                                        <div className="flex-1">
                                            <label className="text-xs font-bold text-gray-500">Time</label>
                                            <input type="time" className="w-full border rounded-lg p-2" value={editing.time} onChange={e=>setEditing({...editing, time:e.target.value})} />
                                        </div>
                                        <div className="flex-1">
                                            <label className="text-xs font-bold text-gray-500">Name</label>
                                            <input className="w-full border rounded-lg p-2" value={editing.name} onChange={e=>setEditing({...editing, name:e.target.value})} />
                                        </div>
                                    </div>
                                    <div>
                                        <label className="text-xs font-bold text-gray-500">Group ID</label>
                                        <input className="w-full border rounded-lg p-2" value={editing.groupId} onChange={e=>setEditing({...editing, groupId:e.target.value})} placeholder="Group ID" />
                                    </div>
                                    
                                    <div>
                                        <label className="text-xs font-bold text-gray-500">Message Type</label>
                                        <select className="w-full border rounded-lg p-2 mt-1" value={editing.type} onChange={e=>setEditing({...editing, type:e.target.value})}>
                                            <option value="text">Text Message</option>
                                            <option value="interactive">Interactive (Title + Desc)</option>
                                            <option value="image">Image (File ID)</option>
                                            <option value="file">File (File ID)</option>
                                        </select>
                                    </div>

                                    {editing.type === 'interactive' && (
                                        <div>
                                            <label className="text-xs font-bold text-gray-500">Title</label>
                                            <input className="w-full border rounded-lg p-2 mb-2 font-bold" value={editing.interactiveTitle || ''} onChange={e=>setEditing({...editing, interactiveTitle:e.target.value})} placeholder="Message Title" />
                                        </div>
                                    )}

                                    {/* Description / Content Area */}
                                    <div>
                                        <div className="flex justify-between mb-1"><label className="text-xs font-bold text-gray-500">{editing.type === 'interactive' ? 'Description' : (editing.type === 'text' ? 'Content' : 'File ID')}</label></div>
                                        
                                        {(editing.type === 'text' || editing.type === 'interactive') && (
                                            <Toolbar setter={(v)=>setEditing({...editing, message:v})} val={editing.message} textRef={modalTextareaRef} />
                                        )}
                                        
                                        <textarea ref={modalTextareaRef} className={`w-full border rounded-lg p-2 text-sm ${editing.type==='text'||editing.type==='interactive' ? 'h-32' : 'h-16 font-mono'}`} value={editing.message} onChange={e=>setEditing({...editing, message:e.target.value})} placeholder={editing.type === 'image' || editing.type === 'file' ? "Paste File ID here..." : "Type message content..."}></textarea>
                                    </div>
                                </div>
                                <div className="flex justify-between pt-4 mt-4 border-t border-gray-100">
                                    <button onClick={()=>deleteTask(editing.id)} className="text-red-500 font-bold text-sm">Delete</button>
                                    <div className="flex gap-2">
                                        <button onClick={()=>setEditing(null)} className="px-4 py-2 text-gray-600 font-bold text-sm">Cancel</button>
                                        <button onClick={saveTask} className="px-6 py-2 bg-blue-600 text-white rounded-lg font-bold text-sm">Save</button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* ALERT MODAL */}
                    {modal && (
                        <div className="fixed inset-0 z-[60] flex items-center justify-center bg-black/50 p-4" onClick={()=>setModal(null)}>
                            <div className="bg-white p-6 rounded-xl shadow-xl max-w-sm w-full" onClick={e=>e.stopPropagation()}>
                                <h3 className={`font-bold mb-2 ${modal.type==='error'?'text-red-600':''}`}>{modal.title}</h3>
                                <p className="text-sm text-gray-600 mb-4">{modal.content}</p>
                                <button onClick={()=>setModal(null)} className="w-full py-2 bg-gray-100 rounded-lg font-bold text-sm">Close</button>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
