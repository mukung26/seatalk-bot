<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SeaAuto</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Outlined" rel="stylesheet">
    <style>
        body { font-family: 'Menlo', 'Monaco', 'Courier New', monospace; background: #0f172a; color: #e2e8f0; }
        .coder-card { background: #1e293b; border: 1px solid #334155; border-radius: 4px; }
        .coder-input { background: #0f172a; border: 1px solid #334155; color: #cbd5e1; font-family: inherit; }
        .coder-input:focus { outline: none; border-color: #3b82f6; }
        .coder-btn { background: #334155; border: 1px solid #475569; padding: 6px 12px; font-size: 12px; transition: 0.1s; display: flex; align-items: center; justify-content: center; gap: 6px; }
        .coder-btn:hover { background: #475569; border-color: #64748b; }
        .coder-btn.primary { background: #2563eb; border-color: #1d4ed8; color: white; }
        .coder-btn.primary:hover { background: #1d4ed8; }
        .coder-btn.danger { background: #7f1d1d; border-color: #991b1b; color: #fecaca; }
        .coder-btn.danger:hover { background: #991b1b; }
        .coder-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        
        /* Custom Scroll */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 2px; }
        ::-webkit-scrollbar-thumb:hover { background: #475569; }
        
        .tab-active { background: #1e293b; color: #3b82f6; border-right: 2px solid #3b82f6; }
        .toolbar-btn { padding: 4px 8px; border-radius: 3px; font-size: 10px; background: #334155; color: #94a3b8; }
        .toolbar-btn:hover { background: #475569; color: white; }

        .img-preview { max-height: 100px; border-radius: 4px; border: 1px solid #334155; margin-bottom: 8px; display: block; }
    </style>
<script type="importmap">
{
  "imports": {
    "@google/genai": "https://esm.sh/@google/genai@^1.38.0",
    "react": "https://esm.sh/react@^19.2.3",
    "react/": "https://esm.sh/react@^19.2.3/"
  }
}
</script>
</head>
<body>
    <div id="root"></div>
    <script type="text/babel">
        const { useState, useEffect, useRef } = React;
        const DEFAULT_WORKER_URL = 'https://seatalk-be.jcruspero3263.workers.dev';

        // --- TOOLBAR COMPONENT ---
        const Toolbar = ({ insert }) => (
            <div className="flex gap-1 mb-2 bg-slate-800 p-1 rounded border border-slate-700">
                <button onClick={() => insert('**', '**')} className="toolbar-btn font-bold">B</button>
                <button onClick={() => insert('*', '*')} className="toolbar-btn italic">I</button>
                <div className="w-px h-4 bg-slate-700 mx-1"></div>
                <button onClick={() => insert('- ')} className="toolbar-btn">List</button>
                <button onClick={() => insert('1. ')} className="toolbar-btn">1.</button>
                <div className="w-px h-4 bg-slate-700 mx-1"></div>
                <button onClick={() => insert('`', '`')} className="toolbar-btn">Code</button>
                <button onClick={() => insert('```\n', '\n```')} className="toolbar-btn">Block</button>
                <div className="w-px h-4 bg-slate-700 mx-1"></div>
                <button onClick={() => insert('<mention-tag target="seatalk://user?id=0"/>')} className="toolbar-btn text-blue-300">@All</button>
                <button onClick={() => insert('<mention-tag target="seatalk://user?email=EMAIL"/>')} className="toolbar-btn text-green-300">@Email</button>
            </div>
        );

        function Login({ onLogin }) {
            const [user, setUser] = useState('');
            const [pass, setPass] = useState('');
            const [error, setError] = useState('');
            const [loading, setLoading] = useState(false);

            const handleLogin = async (e) => {
                e.preventDefault();
                setLoading(true);
                setError('');
                try {
                    const base = DEFAULT_WORKER_URL.endsWith('/') ? DEFAULT_WORKER_URL.slice(0, -1) : DEFAULT_WORKER_URL;
                    const res = await fetch(`${base}/api/login`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ username: user, password: pass })
                    });
                    const data = await res.json();
                    if(data.success && data.token) {
                        onLogin(data.token);
                    } else {
                        setError(data.error || "Login Failed");
                    }
                } catch(err) {
                    setError("Network Error");
                }
                setLoading(false);
            };

            return (
                <div className="flex h-screen items-center justify-center bg-[#0f172a]">
                    <div className="coder-card p-8 w-full max-w-sm">
                        <div className="text-center mb-6">
                            <span className="material-icons-outlined text-4xl text-blue-500">lock</span>
                            <h1 className="text-xl font-bold mt-2">SeaAuto Login</h1>
                        </div>
                        <form onSubmit={handleLogin} className="space-y-4">
                            <div>
                                <label className="block text-xs text-slate-500 mb-1">USERNAME</label>
                                <input className="coder-input w-full p-2 rounded" value={user} onChange={e=>setUser(e.target.value)} />
                            </div>
                            <div>
                                <label className="block text-xs text-slate-500 mb-1">PASSWORD</label>
                                <input type="password" className="coder-input w-full p-2 rounded" value={pass} onChange={e=>setPass(e.target.value)} />
                            </div>
                            {error && <div className="text-red-400 text-xs text-center">{error}</div>}
                            <button disabled={loading} className="coder-btn primary w-full py-2">
                                {loading ? 'ACCESSING...' : 'LOGIN'}
                            </button>
                        </form>
                    </div>
                </div>
            );
        }

        function App() {
            const [token, setToken] = useState(localStorage.getItem('seaauto_token'));
            const [workerUrl] = useState(DEFAULT_WORKER_URL);
            const [tab, setTab] = useState('console');
            const [sidebarVisible, setSidebarVisible] = useState(true);
            
            // Data
            const [config, setConfig] = useState({ tasks: [], isRunning: false });
            const [status, setStatus] = useState({ lastHeartbeat: '-', kvStatus: '-' });
            const [groups, setGroups] = useState([]);
            const [chatHistory, setChatHistory] = useState([]);
            const [logs, setLogs] = useState([]);
            const [loading, setLoading] = useState(false);
            const [clock, setClock] = useState('');

            // Inputs
            const [manual, setManual] = useState({ id: '', msg: '', title: '', description: '', type: 'text', image: null });
            const [chatMsg, setChatMsg] = useState('');
            const [chatImage, setChatImage] = useState(null);
            const [chatRecipient, setChatRecipient] = useState(''); 
            const [editing, setEditing] = useState(null);

            // Refs
            const chatEndRef = useRef(null);
            const manualInputRef = useRef(null);
            const chatInputRef = useRef(null);
            const editorInputRef = useRef(null);
            const editorDescRef = useRef(null);

            // API Wrapper with Auth
            const api = async (path, opts = {}) => {
                if (!token) return null;
                try {
                    const base = workerUrl.endsWith('/') ? workerUrl.slice(0, -1) : workerUrl;
                    const headers = opts.headers || {};
                    headers['Authorization'] = `Bearer ${token}`;
                    
                    const res = await fetch(`${base}${path}`, { ...opts, headers });
                    if(res.status === 401) {
                        setToken(null);
                        localStorage.removeItem('seaauto_token');
                        return null;
                    }
                    return await res.json();
                } catch(e) { console.error(path, e); return null; }
            };

            const refresh = async (silent = false) => {
                if(!token) return;
                if(!silent) setLoading(true);
                const [cfg, sts, grp, ch, lg] = await Promise.all([
                    api('/api/config'),
                    api('/api/status'),
                    api('/api/groups'),
                    api('/api/chat-history'),
                    api('/api/logs')
                ]);
                
                if(cfg) setConfig(cfg);
                if(sts) setStatus(sts);
                if(grp && Array.isArray(grp)) setGroups(grp);
                if(ch && Array.isArray(ch)) setChatHistory(ch);
                if(lg && Array.isArray(lg)) setLogs(lg);
                if(!silent) setLoading(false);
            };

            // Clock Logic
            useEffect(() => {
                const tick = setInterval(() => {
                    const now = new Date();
                    setClock(now.toLocaleTimeString('en-GB', { hour12: false }));
                }, 1000);
                return () => clearInterval(tick);
            }, []);

            useEffect(() => { 
                if(token) {
                    refresh(); 
                    const i = setInterval(() => refresh(true), 5000); 
                    return () => clearInterval(i); 
                }
            }, [token]);

            useEffect(() => { if(tab === 'chat' && chatEndRef.current) chatEndRef.current.scrollIntoView(); }, [chatHistory, tab]);

            // --- IMAGE PASTE HANDLER ---
            const handlePaste = (e, setImageState) => {
                const items = e.clipboardData.items;
                for (let i = 0; i < items.length; i++) {
                    if (items[i].type.indexOf('image') !== -1) {
                        const blob = items[i].getAsFile();
                        const reader = new FileReader();
                        reader.onload = (event) => {
                            setImageState(event.target.result); // Base64
                        };
                        reader.readAsDataURL(blob);
                        e.preventDefault(); // Prevent default paste if image
                        return;
                    }
                }
            };

            // --- IMAGE UPLOAD HELPER ---
            const uploadImage = async (base64) => {
                const res = await api('/api/upload', {
                    method: 'POST',
                    body: JSON.stringify({ imageBase64: base64 })
                });
                if (res && res.success && res.file_id) return res.file_id;
                throw new Error(res?.error || "Image Upload Failed");
            };

            // Insert Helper
            const insertText = (ref, valSetter, currentVal, before, after = '') => {
                const el = ref.current;
                if (!el) return;
                const start = el.selectionStart;
                const end = el.selectionEnd;
                const text = currentVal;
                const newVal = text.substring(0, start) + before + text.substring(start, end) + after + text.substring(end);
                valSetter(newVal);
                setTimeout(() => {
                    el.focus();
                    el.setSelectionRange(start + before.length, start + before.length);
                }, 0);
            };

            // Actions
            const toggleEngine = async () => {
                const newCfg = { ...config, isRunning: !config.isRunning };
                setConfig(newCfg);
                await api('/api/config', { method: 'POST', body: JSON.stringify(newCfg) });
            };

            const resetSystem = async () => {
                if(!confirm("WARNING: ALL DATA WILL BE DELETED.\n\nThis includes:\n- All Automation Tasks\n- Chat History\n- System Logs\n- Engine Status\n\nAre you sure?")) return;
                if(!confirm("Double Check: This cannot be undone. Reset now?")) return;

                setLoading(true);
                const res = await api('/api/reset', { method: 'POST' });
                
                if(res && res.success) {
                    setConfig({ tasks: [], isRunning: false });
                    setChatHistory([]);
                    setLogs([]);
                    alert("System has been reset to defaults.");
                } else {
                    alert("Reset failed: " + (res?.error || "Unknown error"));
                }
                setLoading(false);
            };

            const sendManual = async () => {
                if(!manual.id) return alert("Target Group is required");
                
                setLoading(true);
                try {
                    let messages = [];

                    // 1. Prepare Text Payload
                    if (manual.type === 'interactive') {
                        messages.push({
                            tag: "interactive_message",
                            interactive_message: {
                                elements: [
                                    { tag: "header", text: { content: manual.title, tag: "plain_text" } },
                                    { tag: "section", text: { content: manual.description, tag: "plain_text" } }
                                ]
                            }
                        });
                    } else if (manual.msg) {
                        messages.push({
                            tag: "text",
                            text: { 
                                format: 1, 
                                content: manual.msg,
                                mentioned_list: /@all/i.test(manual.msg) ? ["0"] : undefined 
                            }
                        });
                    }

                    // 2. Prepare Image Payload (if any)
                    if (manual.image) {
                        const fileId = await uploadImage(manual.image);
                        messages.push({
                            tag: "image",
                            image: { file_id: fileId }
                        });
                    }

                    if (messages.length === 0) throw new Error("Please enter a message or paste an image.");

                    const res = await api('/api/send', { method: 'POST', body: JSON.stringify({ groupId: manual.id, message: messages }) });
                    if(res && res.success) {
                        setManual({ ...manual, msg: '', title: '', description: '', image: null });
                        refresh(true);
                    } else {
                        alert("Send Failed");
                    }
                } catch(e) {
                    alert(e.message);
                }
                setLoading(false);
            };

            const sendChat = async () => {
                if(!chatRecipient) return;
                
                try {
                    let messages = [];
                    if (chatMsg) messages.push({ tag: "text", text: { format: 1, content: chatMsg }});
                    if (chatImage) {
                        const fileId = await uploadImage(chatImage);
                        messages.push({ tag: "image", image: { file_id: fileId } });
                    }

                    if(messages.length === 0) return;

                    await api('/api/send', { method: 'POST', body: JSON.stringify({ groupId: chatRecipient, message: messages }) });
                    setChatMsg('');
                    setChatImage(null);
                    refresh(true);
                } catch(e) {
                    alert("Chat Send Error: " + e.message);
                }
            };

            const saveTask = async () => {
                const times = editing.times && editing.times.length > 0 ? editing.times : [editing.time];
                const mainTime = times[0] || "00:00";

                try {
                    let messages = [];

                    // 1. Text / Interactive Payload
                    if (editing.type === 'interactive') {
                         messages.push({
                            tag: "interactive_message",
                            interactive_message: {
                                elements: [
                                    { tag: "header", text: { content: editing.title || "Notification", tag: "plain_text" } },
                                    { tag: "section", text: { content: editing.description || "", tag: "plain_text" } }
                                ]
                            }
                        });
                    } else if (editing.message) {
                        messages.push({
                            tag: "text",
                            text: { 
                                format: 1, 
                                content: editing.message,
                                mentioned_list: /@all/i.test(editing.message) ? ["0"] : undefined 
                            }
                        });
                    }

                    // 2. Image Payload
                    let imageFileId = editing.imageFileId; // existing ID
                    if (editing.image && editing.image.startsWith('data:')) {
                        // New image upload
                        imageFileId = await uploadImage(editing.image);
                    }
                    
                    if (imageFileId) {
                        messages.push({
                            tag: "image",
                            image: { file_id: imageFileId }
                        });
                    }

                    const task = { 
                        ...editing, 
                        time: mainTime, 
                        times: times,   
                        message: JSON.stringify(messages), // Store array as JSON
                        groupName: groups.find(g=>g.id === editing.groupId)?.name || editing.groupId,
                        // Clean up UI-specific fields for storage
                        image: null, 
                        imageFileId: imageFileId
                    };
                    
                    const newTasks = [...(config.tasks||[])];
                    const idx = newTasks.findIndex(x=>x.id === task.id);
                    if(idx > -1) newTasks[idx] = task; else newTasks.push(task);
                    
                    await api('/api/config', { method: 'POST', body: JSON.stringify({ ...config, tasks: newTasks }) });
                    setEditing(null);
                    refresh(true);
                } catch(e) {
                    alert("Save Error: " + e.message);
                }
            };

            const deleteTask = async (id) => {
                if(!confirm("Delete automation?")) return;
                const newTasks = config.tasks.filter(t => t.id !== id);
                await api('/api/config', { method: 'POST', body: JSON.stringify({ ...config, tasks: newTasks }) });
                refresh(true);
            };

            const createNewTask = () => {
                const now = new Date();
                const currentTime = `${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
                setEditing({ 
                    id: Date.now(), 
                    name: 'New_Job', 
                    time: currentTime,
                    times: [currentTime], 
                    groupId: '', 
                    message: '', 
                    description: '', 
                    title: '', 
                    type: 'text', 
                    enabled: true,
                    image: null,
                    imageFileId: null
                });
            };
            
            const editTask = (t) => {
                let type = 'text';
                let msg = '';
                let title = '';
                let desc = '';
                let imageFileId = t.imageFileId;

                try {
                    let parsed = JSON.parse(t.message);
                    // Handle if stored message is array or single object
                    if(!Array.isArray(parsed)) parsed = [parsed];

                    // Extract parts
                    const textPart = parsed.find(p => p.tag === 'text');
                    const interactivePart = parsed.find(p => p.tag === 'interactive_message');
                    const imagePart = parsed.find(p => p.tag === 'image');

                    if (interactivePart) {
                        type = 'interactive';
                        const els = interactivePart.interactive_message?.elements || [];
                        const headerEl = els.find(e => e.tag === 'header');
                        const sectionEl = els.find(e => e.tag === 'section');
                        title = headerEl?.text?.content || '';
                        desc = sectionEl?.text?.content || '';
                    } else if (textPart) {
                        msg = textPart.text.content;
                    }

                    if (imagePart) {
                        imageFileId = imagePart.image.file_id;
                    }
                } catch(e) {}

                setEditing({ ...t, type, message: msg, title, description: desc, times: t.times || [t.time], image: null, imageFileId });
            }

            const addTriggerTime = () => setEditing({...editing, times: [...(editing.times || []), "09:00"]});
            const removeTriggerTime = (idx) => setEditing({...editing, times: editing.times.filter((_, i) => i !== idx)});
            const updateTriggerTime = (idx, val) => {
                const newTimes = [...editing.times];
                newTimes[idx] = val;
                setEditing({...editing, times: newTimes});
            };

            const SidebarItem = ({ id, icon, label }) => (
                <button onClick={() => setTab(id)} className={`w-full text-left p-3 flex items-center gap-3 text-sm font-bold hover:bg-slate-800 ${tab === id ? 'tab-active' : 'text-slate-400'}`}>
                    <span className="material-icons-outlined text-lg">{icon}</span> {label}
                </button>
            );

            // --- RENDER ---

            if (!token) {
                return <Login onLogin={(t) => {
                    localStorage.setItem('seaauto_token', t);
                    setToken(t);
                }} />;
            }

            return (
                <div className="flex h-screen w-full relative">
                    {/* Toggle Button */}
                    <button 
                        onClick={() => setSidebarVisible(!sidebarVisible)} 
                        className="fixed top-3 left-3 z-50 p-2 bg-slate-800 border border-slate-600 rounded text-slate-300 hover:text-white"
                        title="Toggle Sidebar"
                    >
                        <span className="material-icons-outlined text-sm">{sidebarVisible ? 'chevron_left' : 'menu'}</span>
                    </button>

                    {/* Sidebar */}
                    <div className={`flex-shrink-0 border-r border-slate-700 bg-slate-900 flex flex-col transition-all duration-300 ${sidebarVisible ? 'w-64 pt-12' : 'w-0 overflow-hidden opacity-0'}`}>
                        <div className="p-4 border-b border-slate-700 font-bold text-blue-500 flex items-center gap-2">
                            <span className="material-icons-outlined">terminal</span> <span>SeaAuto</span>
                        </div>
                        <div className="flex-1 overflow-y-auto">
                            <SidebarItem id="console" icon="dvr" label="Console" />
                            <SidebarItem id="chat" icon="chat" label="Live Chat" />
                            <SidebarItem id="cron" icon="schedule" label="Cron Jobs" />
                        </div>
                        <div className="p-4 border-t border-slate-700 text-xs text-slate-500 font-mono">
                            <div>CLOCK: {clock}</div>
                            <div className={config.isRunning ? "text-green-500" : "text-red-500"}>{config.isRunning ? "● RUNNING" : "○ STOPPED"}</div>
                            <button onClick={()=>{setToken(null);localStorage.removeItem('seaauto_token');}} className="mt-2 text-red-400 hover:underline">LOGOUT</button>
                        </div>
                    </div>

                    {/* Main */}
                    <div className={`flex-1 flex flex-col min-w-0 bg-[#0f172a] transition-all ${!sidebarVisible ? 'pl-14' : ''}`}>
                        
                        {/* CONSOLE */}
                        {tab === 'console' && (
                            <div className="p-4 md:p-8 space-y-6 overflow-y-auto max-w-7xl mx-auto w-full">
                                <div className="grid grid-cols-1 md:grid-cols-3 gap-4 pt-4 md:pt-0">
                                    <div className="coder-card p-4">
                                        <div className="text-xs text-slate-400 uppercase font-bold mb-1">ENGINE</div>
                                        <div className="flex justify-between items-center">
                                            <span className={`text-xl font-bold ${config.isRunning ? 'text-green-400' : 'text-red-400'}`}>{config.isRunning ? 'ACTIVE' : 'IDLE'}</span>
                                            <button onClick={toggleEngine} className="coder-btn">{config.isRunning ? 'STOP' : 'START'}</button>
                                        </div>
                                    </div>
                                    <div className="coder-card p-4">
                                        <div className="text-xs text-slate-400 uppercase font-bold mb-1">TASKS</div>
                                        <div className="text-xl font-bold text-blue-400">{config.tasks?.filter(t=>t.enabled).length || 0} / {config.tasks?.length || 0}</div>
                                    </div>
                                    <div className="coder-card p-4">
                                        <div className="text-xs text-slate-400 uppercase font-bold mb-1">LAST_HB</div>
                                        <div className="text-xl font-bold text-slate-200">{status.lastHeartbeat.split(' ')[1] || '-'}</div>
                                    </div>
                                </div>

                                <div className="coder-card p-6">
                                    <div className="text-sm font-bold text-blue-400 mb-4 border-b border-slate-700 pb-2 flex justify-between">
                                        <span>QUICK_SEND</span>
                                    </div>
                                    <div className="space-y-4">
                                        <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                            <div>
                                                <label className="block text-xs text-slate-500 mb-1">TARGET_GROUP</label>
                                                <select className="coder-input w-full p-2 text-sm rounded" value={manual.id} onChange={e=>setManual({...manual, id:e.target.value})}>
                                                    <option value="">-- Select Target --</option>
                                                    {groups.map(g => <option key={g.id} value={g.id}>{g.name} [{g.id}]</option>)}
                                                </select>
                                            </div>
                                            <div>
                                                <label className="block text-xs text-slate-500 mb-1">MESSAGE_TYPE</label>
                                                <select className="coder-input w-full p-2 text-sm rounded" value={manual.type} onChange={e=>setManual({...manual, type:e.target.value})}>
                                                    <option value="text">Text (Markdown)</option>
                                                    <option value="interactive">Interactive (Card)</option>
                                                </select>
                                            </div>
                                        </div>

                                        {manual.type === 'interactive' ? (
                                            <div className="space-y-3 p-3 border border-slate-700 rounded bg-slate-900/50">
                                                <div>
                                                    <label className="block text-xs text-slate-500 mb-1">TITLE</label>
                                                    <input className="coder-input w-full p-2 text-sm rounded font-bold" value={manual.title} onChange={e=>setManual({...manual, title:e.target.value})} placeholder="Card Title" />
                                                </div>
                                                <div>
                                                    <label className="block text-xs text-slate-500 mb-1">DESCRIPTION</label>
                                                    <Toolbar insert={(b,a)=>insertText(manualInputRef, (v)=>setManual({...manual, description:v}), manual.description, b, a)} />
                                                    <textarea ref={manualInputRef} className="coder-input w-full p-2 text-sm rounded h-24" value={manual.description} onChange={e=>setManual({...manual, description:e.target.value})} placeholder="Card Description..." />
                                                </div>
                                            </div>
                                        ) : (
                                            <div>
                                                <label className="block text-xs text-slate-500 mb-1">CONTENT (Paste Image Supported)</label>
                                                {manual.image && (
                                                    <div className="relative inline-block mb-2">
                                                        <img src={manual.image} className="img-preview" />
                                                        <button onClick={()=>setManual({...manual, image:null})} className="absolute top-0 right-0 bg-red-500 text-white rounded-full w-5 h-5 flex items-center justify-center text-xs">×</button>
                                                    </div>
                                                )}
                                                <Toolbar insert={(b,a)=>insertText(manualInputRef, (v)=>setManual({...manual, msg:v}), manual.msg, b, a)} />
                                                <textarea ref={manualInputRef} 
                                                    className="coder-input w-full p-3 text-sm font-mono h-24 rounded" 
                                                    value={manual.msg} 
                                                    onChange={e=>setManual({...manual, msg:e.target.value})}
                                                    onPaste={e=>handlePaste(e, (img)=>setManual({...manual, image:img}))}
                                                    placeholder="Type message or paste image here..."
                                                ></textarea>
                                            </div>
                                        )}

                                        <div className="flex justify-end">
                                            <button onClick={sendManual} disabled={loading} className="coder-btn primary">
                                                <span className="material-icons-outlined text-sm">send</span> {loading ? 'SENDING...' : 'EXECUTE'}
                                            </button>
                                        </div>
                                    </div>
                                </div>

                                <div className="coder-card p-4">
                                    <div className="text-xs font-bold text-slate-500 mb-2">LOGS</div>
                                    <div className="h-48 overflow-y-auto font-mono text-xs space-y-1 p-2 bg-black rounded border border-slate-800">
                                        {logs.map((l, i) => (
                                            <div key={i} className="flex gap-2">
                                                <span className="text-slate-500">[{new Date(l.time).toLocaleTimeString()}]</span>
                                                <span className={l.level === 'ERROR' ? 'text-red-500' : 'text-green-500'}>{l.level}</span>
                                                <span className="text-slate-300 break-all">{l.message}</span>
                                            </div>
                                        ))}
                                    </div>
                                </div>

                                {/* Danger Zone */}
                                <div className="coder-card p-4 border-red-900/50 bg-red-900/10">
                                    <div className="text-xs text-red-400 uppercase font-bold mb-2">DANGER ZONE</div>
                                    <div className="flex justify-between items-center">
                                        <span className="text-sm text-red-200">Factory Reset System</span>
                                        <button onClick={resetSystem} className="coder-btn danger">RESET ALL DATA</button>
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* LIVE CHAT */}
                        {tab === 'chat' && (
                            <div className="flex flex-col h-full pt-12 md:pt-0">
                                <div className="p-3 border-b border-slate-700 bg-slate-800 flex justify-between items-center">
                                    <div className="font-bold text-sm">LIVE_STREAM</div>
                                    <div className="flex gap-2">
                                        <button onClick={()=>{
                                            const email = prompt("Enter User Email:");
                                            if(email && email.includes('@')) setChatRecipient(email);
                                            else alert("Invalid email");
                                        }} className="coder-btn">+ DIRECT EMAIL</button>
                                    </div>
                                </div>
                                <div className="flex-1 overflow-y-auto p-4 space-y-4">
                                    {chatHistory.length === 0 && <div className="text-center text-slate-600 mt-10">NO SIGNAL</div>}
                                    {chatHistory.sort((a,b)=>a.time-b.time).map((msg, i) => (
                                        <div key={i} className={`flex flex-col ${msg.direction==='out' ? 'items-end' : 'items-start'}`}>
                                            <div className="text-[10px] text-slate-500 mb-1 flex gap-2 font-mono">
                                                <span className="text-blue-400 font-bold">{msg.senderName}</span>
                                                <span>&lt;{msg.senderEmail || 'N/A'}&gt;</span>
                                                <span>{new Date(msg.time).toLocaleTimeString()}</span>
                                            </div>
                                            <div 
                                                onClick={() => {
                                                    const target = msg.senderEmail || msg.sender;
                                                    setChatRecipient(target);
                                                }}
                                                className={`max-w-[80%] p-3 text-sm rounded cursor-pointer border ${msg.direction==='out' ? 'bg-blue-900/30 border-blue-800 text-blue-100' : 'bg-slate-800 border-slate-700 text-slate-200'}`}
                                            >
                                                {msg.text}
                                            </div>
                                        </div>
                                    ))}
                                    <div ref={chatEndRef}></div>
                                </div>
                                <div className="p-4 bg-slate-800 border-t border-slate-700">
                                    {chatRecipient && <div className="text-xs text-blue-400 mb-2 font-mono flex items-center gap-2">TARGET: <span className="bg-blue-900/50 px-2 rounded">{chatRecipient}</span> <button onClick={()=>setChatRecipient('')} className="text-red-400 hover:underline">CLEAR</button></div>}
                                    {chatImage && (
                                        <div className="relative inline-block mb-2">
                                            <img src={chatImage} className="img-preview" />
                                            <button onClick={()=>setChatImage(null)} className="absolute top-0 right-0 bg-red-500 text-white rounded-full w-5 h-5 flex items-center justify-center text-xs">×</button>
                                        </div>
                                    )}
                                    <Toolbar insert={(b,a)=>insertText(chatInputRef, setChatMsg, chatMsg, b, a)} />
                                    <div className="flex gap-2 mt-2">
                                        <textarea ref={chatInputRef} className="coder-input flex-1 p-2 text-sm rounded h-12 resize-none" 
                                            value={chatMsg} onChange={e=>setChatMsg(e.target.value)} 
                                            onPaste={e=>handlePaste(e, setChatImage)}
                                            onKeyDown={e=>e.key==='Enter' && !e.shiftKey && (e.preventDefault(), sendChat())}
                                            placeholder={chatRecipient ? "Type reply or paste image..." : "Select a message to reply..."}
                                            disabled={!chatRecipient}
                                        />
                                        <button onClick={sendChat} disabled={!chatRecipient} className="coder-btn primary h-12 w-16">SEND</button>
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* CRON JOBS */}
                        {tab === 'cron' && (
                            <div className="p-4 md:p-8 space-y-4 pt-16 md:pt-8">
                                <div className="flex justify-between items-center">
                                    <h2 className="text-lg font-bold text-slate-200">CRONTAB</h2>
                                    <button onClick={createNewTask} className="coder-btn primary">NEW JOB</button>
                                </div>
                                <div className="coder-card overflow-hidden">
                                    <table className="w-full text-left text-sm font-mono">
                                        <thead className="bg-slate-800 text-slate-400 border-b border-slate-700">
                                            <tr>
                                                <th className="p-3">TRIGGERS</th>
                                                <th className="p-3">NAME</th>
                                                <th className="p-3">TARGET</th>
                                                <th className="p-3">STATUS</th>
                                                <th className="p-3 text-right">OP</th>
                                            </tr>
                                        </thead>
                                        <tbody className="divide-y divide-slate-700">
                                            {config.tasks?.map(t => (
                                                <tr key={t.id} className="hover:bg-slate-800/50">
                                                    <td className="p-3">
                                                        <div className="flex flex-wrap gap-1">
                                                            {(t.times || [t.time]).map((tm, idx) => (
                                                                <span key={idx} className="font-bold text-yellow-400 bg-yellow-900/30 px-1 rounded">{tm}</span>
                                                            ))}
                                                        </div>
                                                    </td>
                                                    <td className="p-3">{t.name}</td>
                                                    <td className="p-3 text-xs text-slate-500">{t.groupName}</td>
                                                    <td className="p-3"><span className={`text-xs px-2 py-0.5 rounded ${t.enabled ? 'bg-green-900 text-green-300' : 'bg-red-900 text-red-300'}`}>{t.enabled ? 'ON' : 'OFF'}</span></td>
                                                    <td className="p-3 text-right space-x-2">
                                                        <button onClick={()=>editTask(t)} className="text-blue-400 hover:text-blue-300">MOD</button>
                                                        <button onClick={()=>deleteTask(t.id)} className="text-red-400 hover:text-red-300">KILL</button>
                                                    </td>
                                                </tr>
                                            ))}
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        )}
                    </div>

                    {/* Editor Modal */}
                    {editing && (
                        <div className="fixed inset-0 bg-black/80 flex items-center justify-center p-4 z-[100]">
                            <div className="coder-card w-full max-w-lg p-6 space-y-4 bg-[#0f172a] max-h-[90vh] overflow-y-auto">
                                <div className="text-lg font-bold border-b border-slate-700 pb-2">JOB CONFIG</div>
                                
                                <div className="grid grid-cols-2 gap-4">
                                    <div><label className="block text-xs text-slate-500 mb-1">JOB_ID</label><input className="coder-input w-full p-2 rounded" value={editing.name} onChange={e=>setEditing({...editing, name:e.target.value})} /></div>
                                    <div>
                                        <label className="block text-xs text-slate-500 mb-1">TARGET</label>
                                        <select className="coder-input w-full p-2 rounded" value={editing.groupId} onChange={e=>setEditing({...editing, groupId:e.target.value})}>
                                            <option value="">-- Select Group --</option>
                                            {groups.map(g => <option key={g.id} value={g.id}>{g.name} [{g.id}]</option>)}
                                        </select>
                                    </div>
                                </div>

                                {/* Multi-Trigger Editor */}
                                <div className="bg-slate-900 p-3 rounded border border-slate-700">
                                    <div className="flex justify-between items-center mb-2">
                                        <label className="text-xs text-slate-400 font-bold">TRIGGERS (24H)</label>
                                        <button onClick={addTriggerTime} className="text-xs bg-slate-700 hover:bg-slate-600 px-2 py-0.5 rounded text-slate-200">+ ADD TIME</button>
                                    </div>
                                    <div className="flex flex-wrap gap-2">
                                        {editing.times && editing.times.map((tm, idx) => (
                                            <div key={idx} className="flex items-center gap-1 bg-slate-800 p-1 rounded border border-slate-600">
                                                <input type="time" className="bg-transparent text-white text-xs outline-none" value={tm} onChange={e=>updateTriggerTime(idx, e.target.value)} />
                                                <button onClick={()=>removeTriggerTime(idx)} className="text-red-400 hover:text-red-300 px-1 text-xs">×</button>
                                            </div>
                                        ))}
                                        {(!editing.times || editing.times.length === 0) && <span className="text-xs text-red-500 italic">No triggers set</span>}
                                    </div>
                                </div>

                                <div>
                                    <label className="block text-xs text-slate-500 mb-1">TYPE</label>
                                    <select className="coder-input w-full p-2 rounded" value={editing.type || 'text'} onChange={e=>setEditing({...editing, type:e.target.value})}>
                                        <option value="text">Text Message</option>
                                        <option value="interactive">Interactive</option>
                                    </select>
                                </div>
                                
                                {editing.type === 'interactive' ? (
                                    <div className="space-y-3 p-2 bg-slate-900 border border-slate-700 rounded">
                                        <div>
                                            <label className="block text-xs text-slate-500 mb-1">TITLE</label>
                                            <input className="coder-input w-full p-2 rounded font-bold" value={editing.title} onChange={e=>setEditing({...editing, title:e.target.value})} placeholder="Title" />
                                        </div>
                                        <div>
                                            <label className="block text-xs text-slate-500 mb-1">DESCRIPTION</label>
                                            <Toolbar insert={(b,a)=>insertText(editorDescRef, (v)=>setEditing({...editing, description:v}), editing.description, b, a)} />
                                            <textarea ref={editorDescRef} className="coder-input w-full p-2 rounded h-24" value={editing.description} onChange={e=>setEditing({...editing, description:e.target.value})} placeholder="Description..." />
                                        </div>
                                    </div>
                                ) : (
                                    <div>
                                        <label className="block text-xs text-slate-500 mb-1">PAYLOAD (Paste Image Supported)</label>
                                        {editing.image && (
                                            <div className="relative inline-block mb-2">
                                                <img src={editing.image} className="img-preview" />
                                                <button onClick={()=>setEditing({...editing, image:null})} className="absolute top-0 right-0 bg-red-500 text-white rounded-full w-5 h-5 flex items-center justify-center text-xs">×</button>
                                            </div>
                                        )}
                                        {editing.imageFileId && !editing.image && (
                                            <div className="bg-blue-900/20 text-blue-300 p-2 text-xs rounded mb-2 border border-blue-800">
                                                Image Attached (ID: {editing.imageFileId.substring(0,10)}...) 
                                                <button onClick={()=>setEditing({...editing, imageFileId:null})} className="ml-2 underline text-red-400">Remove</button>
                                            </div>
                                        )}
                                        <Toolbar insert={(b,a)=>insertText(editorInputRef, (v)=>setEditing({...editing, message:v}), editing.message, b, a)} />
                                        <textarea ref={editorInputRef} 
                                            className="coder-input w-full p-3 h-32 rounded font-mono text-xs" 
                                            value={editing.message} 
                                            onChange={e=>setEditing({...editing, message:e.target.value})} 
                                            onPaste={e=>handlePaste(e, (img)=>setEditing({...editing, image:img}))}
                                            placeholder="Message or paste image..."
                                        ></textarea>
                                    </div>
                                )}
                                
                                <div className="flex justify-end gap-3 pt-2">
                                    <button onClick={()=>setEditing(null)} className="coder-btn">CANCEL</button>
                                    <button onClick={saveTask} className="coder-btn primary">COMMIT</button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
