<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SeaAuto Cloud</title>
    
    <!-- Performance Optimization: Preconnect to CDNs -->
    <link rel="preconnect" href="https://cdn.tailwindcss.com">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://unpkg.com">

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Outlined" rel="stylesheet">
    
    <!-- React Dependencies -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        /* Base Settings */
        :root { --safe-bottom: env(safe-area-inset-bottom); }
        body { 
            font-family: 'Roboto', sans-serif; 
            background: #f0f4f8; 
            color: #1f1f1f; 
            overflow: hidden; 
            touch-action: manipulation; /* Improves touch response */
        }
        h1, h2, h3, .google-font { font-family: 'Google Sans', 'Roboto', sans-serif; }
        
        /* UI Elements */
        .m3-card { background: white; border-radius: 16px; border: 1px solid #e0e2e7; transition: transform 0.1s, box-shadow 0.2s; }
        .m3-card:active { transform: scale(0.995); }
        .m3-nav-item { border-radius: 9999px; }
        
        /* Animation & Scroll */
        .modal-enter { animation: modalIn 0.2s cubic-bezier(0.2, 0, 0, 1); }
        @keyframes modalIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
        
        .custom-scroll::-webkit-scrollbar { width: 4px; }
        .custom-scroll::-webkit-scrollbar-track { background: transparent; }
        .custom-scroll::-webkit-scrollbar-thumb { background-color: #cbd5e1; border-radius: 20px; }
        
        /* Chat Styles */
        .chat-bubble { max-width: 85%; border-radius: 18px; padding: 10px 14px; position: relative; font-size: 0.95rem; line-height: 1.4; word-wrap: break-word; }
        .chat-bubble.in { background-color: #ffffff; color: #1e293b; border-bottom-left-radius: 4px; border: 1px solid #e2e8f0; }
        .chat-bubble.out { background-color: #2563eb; color: white; border-bottom-right-radius: 4px; }
        
        /* Mobile Specifics */
        .mobile-safe-bottom { padding-bottom: calc(1rem + var(--safe-bottom, 0px)); }
        
        /* Loading Skeleton */
        .skeleton { background: #e2e8f0; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { opacity: 0.6; } 50% { opacity: 1; } 100% { opacity: 0.6; } }
    </style>
<script type="importmap">
{
  "imports": {
    "@google/genai": "https://esm.sh/@google/genai@^1.38.0",
    "react": "https://esm.sh/react@^19.2.3",
    "react/": "https://esm.sh/react@^19.2.3/"
  }
}
</script>
</head>
<body>
    <div id="root"></div>
    <script type="text/babel">
        const { useState, useEffect, useRef } = React;
        const BACKTICK = String.fromCharCode(96);
        const NEWLINE = String.fromCharCode(10);

        function App() {
            // Setup State
            const [workerUrl, setWorkerUrl] = useState(localStorage.getItem('seaauto_worker_url') || 'https://seatalk-be.jcruspero3263.workers.dev');
            const [isConnected, setIsConnected] = useState(false);

            // UI State
            const [tab, setTab] = useState('status');
            const [sidebarOpen, setSidebarOpen] = useState(window.innerWidth > 1024);
            const [isMobile, setIsMobile] = useState(window.innerWidth <= 1024);

            // Data State
            const [config, setConfig] = useState({ tasks: [], isRunning: false });
            const [groups, setGroups] = useState([]);
            const [status, setStatus] = useState({ lastHeartbeat: 'Checking...', kvStatus: 'Checking...' });
            const [clock, setClock] = useState('--:--:--');
            const [loading, setLoading] = useState(false);
            const [heartbeatStale, setHeartbeatStale] = useState(false);
            
            // Chat State
            const [chatHistory, setChatHistory] = useState([]);
            const [chatRecipient, setChatRecipient] = useState('');
            const [chatMsg, setChatMsg] = useState('');
            const chatEndRef = useRef(null);
            
            // Manual Send State
            const [manual, setManual] = useState({ id: '', msg: '', type: 'text' });
            
            // Modal States
            const [editing, setEditing] = useState(null); 
            const [modal, setModal] = useState(null); 
            
            // Refs
            const textareaRef = useRef(null);
            const modalTextareaRef = useRef(null);

            // Initial Load
            useEffect(() => {
                if(workerUrl) refresh(false);
                const handleResize = () => {
                    const mobile = window.innerWidth <= 1024;
                    setIsMobile(mobile);
                    if (!mobile && !sidebarOpen) setSidebarOpen(true);
                    if (mobile && sidebarOpen) setSidebarOpen(false);
                };
                window.addEventListener('resize', handleResize);
                return () => window.removeEventListener('resize', handleResize);
            }, []);

            // Clock
            useEffect(() => {
                const tick = setInterval(() => {
                    const now = new Date();
                    setClock(now.toLocaleTimeString('en-GB', { timeZone: 'Asia/Singapore', hour12: false }));
                }, 1000);
                return () => clearInterval(tick);
            }, []);

            // API Helper
            const apiCall = async (endpoint, options = {}) => {
                if (!workerUrl) throw new Error("Worker URL not set");
                const base = workerUrl.endsWith('/') ? workerUrl.slice(0, -1) : workerUrl;
                const res = await fetch(`${base}${endpoint}`, options);
                if (!res.ok) throw new Error(`API Error: ${res.statusText}`);
                return res.json();
            };

            const saveWorkerUrl = () => {
                if(!workerUrl.startsWith('http')) return alert("Invalid URL.");
                localStorage.setItem('seaauto_worker_url', workerUrl);
                refresh();
            };

            const refresh = async (silent = false) => {
                if (!workerUrl) return;
                if (!silent) setLoading(true);
                try {
                    const [cfg, sts, chats] = await Promise.all([
                        apiCall('/api/config'),
                        apiCall('/api/status'),
                        apiCall('/api/chat-history').catch(() => [])
                    ]);
                    
                    setConfig(cfg || { tasks: [], isRunning: false });
                    setStatus(prev => ({ ...prev, lastHeartbeat: sts.lastHeartbeat, kvStatus: sts.kvStatus || 'Unknown' }));
                    if (Array.isArray(chats)) setChatHistory(chats);
                    
                    if (sts.lastHeartbeat && (sts.lastHeartbeat === 'Waiting for Cron...' || sts.lastHeartbeat === 'Waiting...')) {
                        setHeartbeatStale(true);
                    } else {
                        setHeartbeatStale(false);
                    }

                    try {
                        const grp = await apiCall('/api/groups');
                        if(Array.isArray(grp)) setGroups(grp);
                    } catch(e) {}

                    setIsConnected(true);
                } catch(e) { 
                    if(!silent) setModal({ title: "Connection Failed", content: "Could not connect to Cloudflare Worker.\nCheck URL.", type: 'error' });
                    setIsConnected(false);
                }
                if(!silent) setLoading(false);
            };

            // Polling
            useEffect(() => { 
                if(isConnected) {
                    const interval = tab === 'chat' ? 5000 : 30000;
                    const sync = setInterval(() => refresh(true), interval);
                    return () => clearInterval(sync); 
                }
            }, [isConnected, tab]);

            // Auto-scroll
            useEffect(() => {
                if (tab === 'chat' && chatEndRef.current) {
                    chatEndRef.current.scrollIntoView({ behavior: 'smooth' });
                }
            }, [chatHistory, tab]);

            // Formatting Logic
            const insertFormat = (ref, currentMsg, setMsg, before, after = '') => {
                const el = ref.current;
                if (!el) return;
                const start = el.selectionStart;
                const end = el.selectionEnd;
                const val = currentMsg;
                const sel = val.substring(start, end);
                const isWrapped = val.substring(start - before.length, start) === before && val.substring(end, end + after.length) === after;
                let newVal = isWrapped ? val.substring(0, start - before.length) + sel + val.substring(end + after.length) : val.substring(0, start) + before + sel + after + val.substring(end);
                setMsg(newVal);
                // Defer focus to allow UI update on mobile
                requestAnimationFrame(() => {
                    el.focus();
                    const newCursor = isWrapped ? start - before.length : start + before.length;
                    el.setSelectionRange(newCursor, newCursor + sel.length);
                });
            };

            const insertList = (ref, currentMsg, setMsg, prefix) => {
                const el = ref.current;
                if (!el) return;
                const start = el.selectionStart;
                const val = currentMsg;
                const lineStart = val.lastIndexOf(NEWLINE, start - 1) + 1;
                const newVal = val.substring(0, lineStart) + prefix + val.substring(lineStart);
                setMsg(newVal);
                requestAnimationFrame(() => {
                    el.focus();
                    el.setSelectionRange(start + prefix.length, start + prefix.length);
                });
            };

            const insertMention = (ref, currentMsg, setMsg, type) => {
                let tag = '';
                if(type === 'all') tag = '<mention-tag target="seatalk://user?id=0"/>';
                else if(type === 'email') tag = '<mention-tag target="seatalk://user?email=example@domain.com"/>';
                insertFormat(ref, currentMsg, setMsg, tag);
            };
            
            // Handlers
            const manualFormat = (b, a) => insertFormat(textareaRef, manual.msg, (m) => setManual(prev => ({...prev, msg: m})), b, a);
            const manualList = (p) => insertList(textareaRef, manual.msg, (m) => setManual(prev => ({...prev, msg: m})), p);
            const manualMention = (t) => insertMention(textareaRef, manual.msg, (m) => setManual(prev => ({...prev, msg: m})), t);

            const modalFormat = (b, a) => insertFormat(modalTextareaRef, editing.message, (m) => setEditing(prev => ({...prev, message: m})), b, a);
            const modalList = (p) => insertList(modalTextareaRef, editing.message, (m) => setEditing(prev => ({...prev, message: m})), p);
            const modalMention = (t) => insertMention(modalTextareaRef, editing.message, (m) => setEditing(prev => ({...prev, message: m})), t);

            // Actions
            const saveConfig = async (newCfg) => {
                setConfig(newCfg); 
                await apiCall('/api/config', { method: 'POST', body: JSON.stringify(newCfg) });
                refresh(true);
            };

            const runTest = async () => {
                setLoading(true);
                try {
                    const d = await apiCall('/api/test-cron');
                    setModal({ title: "Cron Result", content: JSON.stringify(d, null, 2), type: 'success' });
                    refresh(true);
                } catch(e) { setModal({ title: "Error", content: e.message, type: 'error' }); } 
                finally { setLoading(false); }
            };

            const viewSystemLogs = async () => {
                setLoading(true);
                try {
                    const logs = await apiCall('/api/logs');
                    setModal({
                        title: "System Logs",
                        type: 'info',
                        content: (
                            <div className="space-y-0 text-xs font-mono max-h-64 overflow-y-auto">
                                {logs.length === 0 ? <p className="text-gray-500 italic p-2">No logs.</p> : logs.map((l, i) => (
                                    <div key={i} className={`border-b border-gray-100 py-1.5 flex flex-col md:flex-row gap-1 md:gap-2 ${l.level === 'ERROR' ? 'bg-red-50 text-red-800 px-1' : ''}`}>
                                        <div className="flex gap-2">
                                            <span className="text-gray-400 shrink-0">{new Date(l.time).toLocaleTimeString()}</span>
                                            <span className={`font-bold shrink-0 w-12 ${l.level === 'ERROR' ? 'text-red-600' : 'text-blue-600'}`}>{l.level}</span>
                                        </div>
                                        <span className="text-gray-700 break-all">{l.message}</span>
                                    </div>
                                ))}
                            </div>
                        )
                    });
                } catch(e) { setModal({ title: "Error", content: e.message, type: 'error' }); }
                setLoading(false);
            };

            const sendManual = async () => {
                if(!manual.id || !manual.msg) return setModal({ title: "Missing Info", content: "Select group & type message.", type: 'error' });
                let finalMsg = manual.msg;
                if (manual.type !== 'text' && !manual.msg.trim().startsWith('{')) {
                    if(manual.type === 'image') finalMsg = JSON.stringify({ tag: "image", image: { file_id: manual.msg.trim() } });
                    else if(manual.type === 'file') finalMsg = JSON.stringify({ tag: "file", file: { file_id: manual.msg.trim() } });
                }
                try {
                    const d = await apiCall('/api/send', { method: 'POST', body: JSON.stringify({ groupId: manual.id, message: finalMsg }) });
                    if(d.success) { 
                        setModal({ title: "Sent", content: "Message sent!", type: 'success' }); 
                        setManual({...manual, msg:''}); refresh(true);
                    } else { setModal({ title: "Failed", content: "Check logs.", type: 'error' }); }
                } catch(e) { setModal({ title: "Error", content: e.message, type: 'error' }); }
            };

            const sendChatReply = async () => {
                if (!chatRecipient || !chatMsg.trim()) return;
                try {
                    const d = await apiCall('/api/send', { 
                        method: 'POST', body: JSON.stringify({ groupId: chatRecipient, message: chatMsg }) 
                    });
                    if (d.success) { setChatMsg(''); refresh(true); }
                } catch(e) { console.error(e); }
            };

            const createNewTask = () => setEditing({ id: Date.now(), name: 'New Task', groupId: '', time: '09:00', message: '', type: 'text', enabled: true });
            
            const saveTask = () => {
                if (!editing.name || !editing.groupId || !editing.time) return alert("Fill required fields");
                let finalMsg = editing.message;
                if (editing.type !== 'text') {
                    if (editing.type === 'image') finalMsg = JSON.stringify({ tag: "image", image: { file_id: editing.message.trim() } });
                    else if (editing.type === 'file') finalMsg = JSON.stringify({ tag: "file", file: { file_id: editing.message.trim() } });
                }
                const newTask = { ...editing, message: finalMsg, groupName: groups.find(g => g.id === editing.groupId)?.name || 'Unknown' };
                let newTasks = [...(config.tasks || [])];
                const idx = newTasks.findIndex(t => t.id === newTask.id);
                if(idx > -1) newTasks[idx] = newTask; else newTasks.push(newTask);
                saveConfig({ ...config, tasks: newTasks });
                setEditing(null);
            };

            const Toolbar = ({ isText, onFormat, onList, onMention }) => {
                if (!isText) return null;
                return (
                    <div className="flex overflow-x-auto items-center gap-1 mb-2 bg-slate-50 p-1 rounded-lg border border-slate-200 no-scrollbar">
                        <button onClick={()=>onFormat('**', '**')} className="p-2 hover:bg-white rounded min-w-[36px]" title="Bold"><span className="material-icons-outlined text-base">format_bold</span></button>
                        <button onClick={()=>onFormat('*', '*')} className="p-2 hover:bg-white rounded min-w-[36px]" title="Italic"><span className="material-icons-outlined text-base">format_italic</span></button>
                        <div className="w-px h-4 bg-gray-300 mx-1 flex-shrink-0"></div>
                        <button onClick={()=>onList('- ')} className="p-2 hover:bg-white rounded min-w-[36px]" title="Bullet List"><span className="material-icons-outlined text-base">format_list_bulleted</span></button>
                        <div className="w-px h-4 bg-gray-300 mx-1 flex-shrink-0"></div>
                        <button onClick={()=>onMention('all')} className="px-3 py-1 text-xs font-bold bg-blue-100 text-blue-700 rounded whitespace-nowrap">@All</button>
                    </div>
                );
            };

            if (!isConnected && !loading) {
                return (
                    <div className="min-h-[100dvh] flex items-center justify-center bg-slate-50 p-4">
                        <div className="bg-white p-6 rounded-2xl shadow-lg max-w-sm w-full">
                            <h1 className="text-xl font-bold mb-2 text-slate-800">Connect</h1>
                            <input className="w-full border rounded-lg p-3 mb-4 text-sm" placeholder="https://your-worker.workers.dev" value={workerUrl} onChange={e => setWorkerUrl(e.target.value)} />
                            <button onClick={saveWorkerUrl} className="w-full bg-blue-600 text-white font-bold py-3 rounded-lg">Connect</button>
                        </div>
                    </div>
                );
            }

            if (loading && !config.tasks) return <div className="h-[100dvh] flex items-center justify-center bg-white"><div className="w-10 h-10 border-4 border-blue-600 border-t-transparent rounded-full animate-spin"></div></div>;

            return (
                <div className="flex h-[100dvh] bg-[#f0f4f8] overflow-hidden flex-col md:flex-row">
                    {/* Header (Desktop) / Topbar (Mobile) */}
                    <header className="flex-shrink-0 h-14 bg-white border-b border-gray-200 flex items-center justify-between px-4 z-20 shadow-sm md:w-full md:fixed md:top-0 md:left-0 md:pl-72">
                        <div className="flex items-center gap-3">
                            <span className="material-icons-outlined text-blue-600 text-2xl md:hidden">cloud_circle</span>
                            <span className="font-bold text-gray-700 google-font md:hidden">SeaAuto</span>
                            <span className="hidden md:block font-medium text-gray-500 text-sm">Workspace</span>
                        </div>
                        <div className="flex items-center gap-2">
                            <div className={`flex items-center gap-2 px-3 py-1 rounded-full text-xs font-bold ${config.isRunning ? 'bg-green-100 text-green-700' : 'bg-gray-100 text-gray-600'}`}>
                                <div className={`w-2 h-2 rounded-full ${config.isRunning ? 'bg-green-600' : 'bg-gray-400'}`}></div>
                                {config.isRunning ? 'ON' : 'OFF'}
                            </div>
                        </div>
                    </header>

                    {/* Navigation Sidebar (Desktop) / Bottom Bar (Mobile) */}
                    <aside className="hidden md:flex flex-col fixed top-0 bottom-0 left-0 w-72 bg-white border-r border-gray-200 z-30">
                        <div className="h-14 flex items-center px-6 border-b border-gray-100">
                             <span className="material-icons-outlined text-blue-600 text-2xl mr-2">cloud_circle</span>
                             <span className="text-xl font-bold text-gray-800">SeaAuto</span>
                        </div>
                        <div className="p-4 space-y-1 flex-1 overflow-y-auto">
                            {[
                                { id: 'status', icon: 'dashboard', label: 'Dashboard' },
                                { id: 'tasks', icon: 'schedule', label: 'Automations' },
                                { id: 'chat', icon: 'forum', label: 'Live Chat' },
                                { id: 'manual', icon: 'send', label: 'Quick Send' }
                            ].map(item => (
                                <button key={item.id} onClick={() => setTab(item.id)} className={`w-full flex items-center px-4 py-3 text-sm font-medium transition-colors m3-nav-item ${tab === item.id ? 'bg-blue-50 text-blue-700' : 'text-gray-600 hover:bg-gray-50'}`}>
                                    <span className="material-icons-outlined mr-4">{item.icon}</span>{item.label}
                                </button>
                            ))}
                        </div>
                        <div className="p-4 border-t border-gray-100 bg-gray-50/50">
                            <div className="text-xs font-medium text-gray-500 uppercase">Server Time (GMT+8)</div>
                            <div className="font-mono text-xl text-gray-800 font-bold">{clock}</div>
                        </div>
                    </aside>

                    {/* Mobile Bottom Nav */}
                    <div className="md:hidden fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 flex justify-around items-center h-16 z-50 pb-[env(safe-area-inset-bottom)]">
                         {[
                            { id: 'status', icon: 'dashboard', label: 'Home' },
                            { id: 'tasks', icon: 'schedule', label: 'Auto' },
                            { id: 'chat', icon: 'forum', label: 'Chat' },
                            { id: 'manual', icon: 'send', label: 'Send' }
                        ].map(item => (
                            <button key={item.id} onClick={() => setTab(item.id)} className={`flex flex-col items-center justify-center w-full h-full ${tab === item.id ? 'text-blue-600' : 'text-gray-400'}`}>
                                <span className="material-icons-outlined text-2xl mb-0.5">{item.icon}</span>
                                <span className="text-[10px] font-medium">{item.label}</span>
                            </button>
                        ))}
                    </div>

                    {/* Main Content Area */}
                    <main className="flex-1 md:ml-72 md:mt-14 overflow-y-auto custom-scroll h-full pb-20 md:pb-0">
                        <div className="max-w-5xl mx-auto p-4 md:p-8">
                            
                            {/* DASHBOARD */}
                            {tab === 'status' && (
                                <div className="space-y-4 animate-fade-in">
                                    <div className="m3-card p-5 bg-gradient-to-br from-white to-blue-50/50">
                                        <h2 className="text-lg font-bold text-gray-800 mb-2">Engine Status</h2>
                                        <div className="flex items-center justify-between mb-4">
                                            <p className="text-sm text-gray-500">Master switch for tasks.</p>
                                            <div className={`px-3 py-1 rounded-full text-xs font-bold border ${config.isRunning ? 'bg-green-100 text-green-700 border-green-200' : 'bg-gray-100 text-gray-500 border-gray-200'}`}>{config.isRunning ? 'ACTIVE' : 'PAUSED'}</div>
                                        </div>
                                        <button onClick={()=>saveConfig({...config, isRunning: !config.isRunning})} className={`w-full py-3 rounded-xl font-medium text-sm shadow-sm transition-transform active:scale-95 text-white ${config.isRunning ? 'bg-red-500' : 'bg-blue-600'}`}>{config.isRunning ? 'Stop Automation' : 'Start Automation'}</button>
                                    </div>
                                    
                                    <div className="m3-card p-5">
                                        <h2 className="text-lg font-bold text-gray-800 mb-4">Health Check</h2>
                                        <div className="grid grid-cols-2 gap-3 mb-4">
                                            <div className="bg-gray-50 p-3 rounded-xl">
                                                <div className="text-xs text-gray-500 mb-1">Database</div>
                                                <div className={`font-bold text-sm ${status.kvStatus === 'Connected' ? 'text-green-600' : 'text-red-500'}`}>{status.kvStatus}</div>
                                            </div>
                                            <div className="bg-gray-50 p-3 rounded-xl">
                                                <div className="text-xs text-gray-500 mb-1">Heartbeat</div>
                                                <div className={`font-bold text-xs truncate ${heartbeatStale ? 'text-red-500' : 'text-green-600'}`}>{status.lastHeartbeat}</div>
                                            </div>
                                        </div>
                                        {heartbeatStale && <div className="text-xs bg-red-50 text-red-700 p-2 rounded mb-3">⚠️ Cron Job Missing. Add <code>* * * * *</code> trigger in Cloudflare.</div>}
                                        <div className="flex gap-2">
                                            <button onClick={runTest} className="flex-1 py-2.5 bg-blue-50 text-blue-700 rounded-lg text-xs font-bold">Test Cron</button>
                                            <button onClick={viewSystemLogs} className="flex-1 py-2.5 bg-gray-100 text-gray-700 rounded-lg text-xs font-bold">Logs</button>
                                        </div>
                                    </div>
                                </div>
                            )}

                            {/* TASKS */}
                            {tab === 'tasks' && (
                                <div className="space-y-4 animate-fade-in">
                                    <div className="flex justify-between items-center mb-2">
                                        <h2 className="text-xl font-bold text-gray-800">Schedules</h2>
                                        <button onClick={createNewTask} className="w-10 h-10 bg-blue-600 text-white rounded-full shadow-lg flex items-center justify-center active:scale-90 transition-transform"><span className="material-icons-outlined">add</span></button>
                                    </div>
                                    <div className="space-y-3">
                                        {config.tasks?.length > 0 ? config.tasks.map(t => (
                                            <div key={t.id} onClick={()=>setEditing(t)} className="m3-card p-4 flex items-center gap-3 active:scale-[0.98]">
                                                <div className="w-12 h-12 bg-blue-50 rounded-xl flex flex-col items-center justify-center text-blue-600 flex-shrink-0">
                                                    <span className="text-sm font-bold">{t.time}</span>
                                                    <span className="text-[9px] font-bold uppercase opacity-60">Daily</span>
                                                </div>
                                                <div className="flex-1 min-w-0">
                                                    <h3 className="font-bold text-gray-900 text-sm truncate">{t.name}</h3>
                                                    <p className="text-xs text-gray-500 truncate">{t.groupName || t.groupId}</p>
                                                </div>
                                                <div className={`w-3 h-3 rounded-full ${t.enabled ? 'bg-green-500' : 'bg-gray-300'}`}></div>
                                            </div>
                                        )) : <div className="text-center py-10 text-gray-400">No tasks found. Tap + to add.</div>}
                                    </div>
                                </div>
                            )}

                            {/* CHAT */}
                            {tab === 'chat' && (
                                <div className="fixed inset-0 top-14 bottom-16 md:static md:h-[calc(100vh-100px)] flex flex-col bg-slate-100 md:bg-white md:border md:rounded-xl md:shadow-sm">
                                    <div className="flex-1 overflow-y-auto p-4 space-y-3 custom-scroll">
                                        {chatHistory.length === 0 ? (
                                            <div className="flex h-full items-center justify-center text-gray-400 text-sm flex-col">
                                                <span className="material-icons-outlined text-4xl mb-2">chat_bubble_outline</span>
                                                No messages yet
                                            </div>
                                        ) : (
                                            chatHistory.sort((a,b) => a.time - b.time).map((msg, i) => (
                                                <div key={i} className={`flex w-full ${msg.direction === 'out' ? 'justify-end' : 'justify-start'}`}>
                                                    <div onClick={() => msg.sender && setChatRecipient(msg.sender)} className={`chat-bubble max-w-[85%] ${msg.direction === 'out' ? 'out' : 'in'} shadow-sm active:opacity-80`}>
                                                        <div className="text-[10px] opacity-60 mb-1 flex justify-between gap-4">
                                                            <span className="font-bold">{msg.direction === 'out' ? 'You' : (msg.senderName?.split(' ')[0] || 'User')}</span>
                                                        </div>
                                                        <div>{msg.text}</div>
                                                    </div>
                                                </div>
                                            ))
                                        )}
                                        <div ref={chatEndRef}></div>
                                    </div>
                                    
                                    {/* Chat Input */}
                                    <div className="p-3 bg-white border-t border-gray-200 mobile-safe-bottom">
                                        {chatRecipient && (
                                            <div className="flex items-center justify-between bg-blue-50 px-3 py-1.5 rounded-lg text-xs text-blue-800 mb-2 border border-blue-100">
                                                <span className="truncate max-w-[200px]">Replying to: <b>{chatRecipient}</b></span>
                                                <button onClick={()=>setChatRecipient('')} className="p-1"><span className="material-icons-outlined text-sm">close</span></button>
                                            </div>
                                        )}
                                        <div className="flex gap-2">
                                            <input 
                                                className="flex-1 bg-gray-100 text-sm rounded-full px-4 py-2.5 outline-none focus:ring-2 focus:ring-blue-500/50 transition-all"
                                                placeholder={chatRecipient ? "Type reply..." : "Tap a message to reply"}
                                                value={chatMsg}
                                                onChange={e=>setChatMsg(e.target.value)}
                                                disabled={!chatRecipient}
                                            />
                                            <button 
                                                onClick={sendChatReply}
                                                disabled={!chatRecipient || !chatMsg.trim()}
                                                className="bg-blue-600 text-white w-10 h-10 rounded-full flex items-center justify-center disabled:opacity-50 disabled:bg-gray-300"
                                            >
                                                <span className="material-icons-outlined text-lg">send</span>
                                            </button>
                                        </div>
                                    </div>
                                </div>
                            )}

                            {/* MANUAL SEND */}
                            {tab === 'manual' && (
                                <div className="space-y-4 animate-fade-in">
                                    <h2 className="text-xl font-bold text-gray-800">Quick Send</h2>
                                    <div className="m3-card p-5 space-y-4">
                                        <div>
                                            <label className="text-xs font-bold text-gray-500 uppercase">To</label>
                                            <select className="w-full mt-1 bg-gray-50 border border-gray-200 rounded-xl p-3 text-sm outline-none" value={manual.id} onChange={e=>setManual({...manual, id:e.target.value})}>
                                                <option value="">Select Group...</option>
                                                {groups.map(g => <option key={g.id} value={g.id}>{g.name}</option>)}
                                            </select>
                                        </div>
                                        <div>
                                            <label className="text-xs font-bold text-gray-500 uppercase">Type</label>
                                            <div className="flex gap-2 mt-1">
                                                {['text', 'image', 'file'].map(t => (
                                                    <button key={t} onClick={()=>setManual({...manual, type: t})} className={`px-4 py-2 rounded-lg text-xs font-bold capitalize border ${manual.type === t ? 'bg-blue-600 text-white border-blue-600' : 'bg-white text-gray-600 border-gray-200'}`}>{t}</button>
                                                ))}
                                            </div>
                                        </div>
                                        <div>
                                            <div className="flex justify-between items-center mb-1">
                                                <label className="text-xs font-bold text-gray-500 uppercase">Message</label>
                                                {manual.type === 'text' && <button onClick={()=>setModal({type:'help', title:'Formatting', content:''})} className="text-xs text-blue-600">Help</button>}
                                            </div>
                                            <Toolbar isText={manual.type === 'text'} onFormat={manualFormat} onList={manualList} onMention={manualMention} />
                                            <textarea ref={textareaRef} className="w-full bg-gray-50 border border-gray-200 rounded-xl p-3 h-32 text-sm outline-none focus:border-blue-500 transition-colors" value={manual.msg} onChange={e=>setManual({...manual, msg:e.target.value})} placeholder={manual.type === 'text' ? "Type message..." : "File ID..."}></textarea>
                                        </div>
                                        <button onClick={sendManual} className="w-full bg-blue-600 text-white font-bold py-3.5 rounded-xl shadow-md active:scale-95 transition-transform flex items-center justify-center gap-2">
                                            <span className="material-icons-outlined text-lg">send</span> Send Now
                                        </button>
                                    </div>
                                </div>
                            )}

                        </div>
                    </main>

                    {/* Editor Modal */}
                    {editing && (
                        <div className="fixed inset-0 z-[60] flex items-center justify-center bg-black/50 p-4 backdrop-blur-sm animate-fade-in">
                            <div className="bg-white w-full max-w-md rounded-2xl overflow-hidden shadow-2xl flex flex-col max-h-[90vh]">
                                <div className="p-4 border-b border-gray-100 flex justify-between items-center">
                                    <h3 className="font-bold text-lg">Edit Task</h3>
                                    <button onClick={()=>setEditing(null)} className="p-1 rounded-full hover:bg-gray-100"><span className="material-icons-outlined">close</span></button>
                                </div>
                                <div className="p-5 space-y-4 overflow-y-auto custom-scroll">
                                    <div className="bg-blue-50 p-3 rounded-xl border border-blue-100 flex justify-between items-center">
                                        <label className="text-xs font-bold text-blue-800 uppercase">Time</label>
                                        <input type="time" className="bg-transparent text-xl font-bold text-blue-900 outline-none text-right" value={editing.time} onChange={e=>setEditing({...editing, time:e.target.value})} />
                                    </div>
                                    <input className="w-full bg-gray-50 border border-gray-200 rounded-xl p-3 text-sm" placeholder="Task Name" value={editing.name} onChange={e=>setEditing({...editing, name:e.target.value})} />
                                    <select className="w-full bg-gray-50 border border-gray-200 rounded-xl p-3 text-sm" value={editing.groupId} onChange={e=>setEditing({...editing, groupId:e.target.value})}><option value="">Select Group...</option>{groups.map(g => <option key={g.id} value={g.id}>{g.name}</option>)}</select>
                                    
                                    <div>
                                        <Toolbar isText={editing.type === 'text'} onFormat={modalFormat} onList={modalList} onMention={modalMention} />
                                        <textarea ref={modalTextareaRef} className="w-full bg-gray-50 border border-gray-200 rounded-xl p-3 h-32 text-sm" placeholder="Message..." value={editing.message} onChange={e=>setEditing({...editing, message:e.target.value})}></textarea>
                                    </div>
                                    <div className="flex justify-between items-center pt-2">
                                        <button onClick={()=>deleteTask(editing.id)} className="text-red-500 text-sm font-medium px-2">Delete</button>
                                        <div className="flex gap-2">
                                            <button onClick={()=>setEditing(null)} className="px-4 py-2 text-gray-600 font-bold text-sm">Cancel</button>
                                            <button onClick={saveTask} className="px-6 py-2 bg-blue-600 text-white rounded-xl font-bold text-sm shadow-sm">Save</button>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Alert Modal */}
                    {modal && (
                        <div className="fixed inset-0 z-[70] flex items-center justify-center bg-black/60 p-6 backdrop-blur-sm animate-fade-in" onClick={()=>setModal(null)}>
                            <div className="bg-white w-full max-w-sm rounded-2xl shadow-xl overflow-hidden" onClick={e=>e.stopPropagation()}>
                                <div className={`p-4 flex items-center gap-3 border-b border-gray-100 ${modal.type==='error'?'bg-red-50 text-red-700':''}`}>
                                    <span className="material-icons-outlined">{modal.type === 'error' ? 'error' : 'info'}</span>
                                    <h3 className="font-bold">{modal.title}</h3>
                                </div>
                                <div className="p-5 max-h-[60vh] overflow-y-auto">
                                    {modal.type === 'help' ? (
                                        <div className="text-sm space-y-2 text-gray-600">
                                            <p><b>**Bold**</b>, <i>*Italic*</i></p>
                                            <p><code>{BACKTICK}Code{BACKTICK}</code></p>
                                            <p>Lists: <code>- Item</code></p>
                                        </div>
                                    ) : (typeof modal.content === 'string' ? <p className="text-sm text-gray-600 whitespace-pre-wrap">{modal.content}</p> : modal.content)}
                                </div>
                                <div className="p-3 bg-gray-50 text-right"><button onClick={()=>setModal(null)} className="px-4 py-2 bg-white border rounded-lg text-sm font-bold shadow-sm">Close</button></div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
